<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Store Outage Map</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            display: flex;
        }

        /* Right-side panel */
        #sidebar {
            width: 300px;
            background: #f7f7f7;
            border-left: 1px solid #ccc;
            padding: 10px;
            overflow-y: auto;
            height: 100vh;
        }

        #sidebar h2 {
            margin-top: 0;
            font-size: 18px;
            text-align: center;
        }

        .store-item {
            padding: 8px;
            margin: 6px 0;
            background: white;
            border-radius: 6px;
            cursor: pointer;
            border: 1px solid #ddd;
        }

        .store-item:hover {
            background: #e9f3ff;
        }

        #map {
            flex: 1;
            height: 100vh;
        }

        .legend {
            background: white;
            padding: 10px;
            line-height: 1.5;
            border-radius: 6px;
            box-shadow: 0 0 5px rgba(0,0,0,0.3);
        }
        .legend div {
            display: flex;
            align-items: center;
        }
        .legend span {
            height: 12px;
            width: 12px;
            margin-right: 6px;
            display: inline-block;
        }
    </style>
</head>

<body>

<div id="map"></div>

<div id="sidebar">
    <h2>Impacted Stores</h2>
    <div id="storeList"></div>
</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
// ==========================================
// LOAD OUTAGE DATA
// ==========================================

fetch("outages.json")
    .then(response => response.json())
    .then(data => initMap(data))
    .catch(err => console.error("Error loading outages.json:", err));

// ==========================================
// INITIALIZE MAP
// ==========================================

function initMap(outages) {

    let map = L.map("map").setView([37.5, -95.5], 5);

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 18,
        attribution: "© OpenStreetMap"
    }).addTo(map);

    const colorMap = {
        red: "red",
        yellow: "orange",
        white: "blue"
    };

    let markers = {};

    // ==========================================
    // ADD MARKERS
    // ==========================================

    outages.forEach(store => {

        let color = colorMap[store.color] || "blue";

        let marker = L.circleMarker([store.lat, store.lon], {
            radius: 10,
            color: color,
            fillColor: color,
            fillOpacity: 0.8
        });

        let popupHtml = `
            <b>Store ${store.storeNumber} – ${store.storeName}</b><br>
            ${store.address}<br><br>

            <b>Distance:</b> ${store.distanceMiles} miles<br>
            <b>Status:</b> ${store.status}<br>
            <b>Planned:</b> ${store.plannedOutage}<br>
            <b>ETA:</b> ${store.etr}<br>
            <b>Last Updated:</b> ${store.lastUpdated}<br><br>

            <b>Store Location:</b> ${store.lat}, ${store.lon}<br>
            <b>Outage Location:</b> ${store.outageLat}, ${store.outageLon}<br>
        `;

        marker.bindPopup(popupHtml);
        marker.addTo(map);

        markers[store.storeNumber] = marker;
    });

    // ==========================================
    // POPULATE RIGHT-SIDE STORE LIST
    // ==========================================

    let storeListDiv = document.getElementById("storeList");

    outages.forEach(store => {
        let div = document.createElement("div");
        div.className = "store-item";
        div.innerHTML = `
            <b>${store.storeNumber} – ${store.storeName}</b><br>
            ${store.address}<br>
            <span style="color:${colorMap[store.color]}">● ${store.color.toUpperCase()}</span>
        `;

        div.onclick = () => {
            let marker = markers[store.storeNumber];
            map.setView([store.lat, store.lon], 14);
            marker.openPopup();
        };

        storeListDiv.appendChild(div);
    });

    // ==========================================
    // LEGEND
    // ==========================================

    let legend = L.control({ position: "bottomright" });

    legend.onAdd = function () {
        let div = L.DomUtil.create("div", "legend");

        div.innerHTML = `
            <div><span style="background:red"></span> Outage Detected (0–0.5 miles)</div>
            <div><span style="background:orange"></span> Possible Outage (0.5–1 mile)</div>
            <div><span style="background:blue"></span> Store Impacted (>1 mile)</div>
        `;

        return div;
    };

    legend.addTo(map);
}
</script>

</body>
</html>

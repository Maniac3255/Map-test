<style>
:root{--side:360px;--dash:300px;--panel:#15181b;--border:#30363b;--red:#e53935;--yellow:#fbc02d;--gray:#707780}*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden;font-family:Arial,sans-serif;background:#101214}button,input,select{font:inherit}#map{position:absolute;inset:0 var(--side) 0 0;transition:.28s right,.28s bottom}body.side-closed #map{right:0}body.dash-open #map{bottom:var(--dash)}#sidebar{position:absolute;top:0;right:0;bottom:0;width:var(--side);padding:14px;overflow:auto;color:#fff;background:var(--panel);border-left:1px solid var(--border);z-index:1000;transition:.28s transform}body.side-closed #sidebar{transform:translateX(100%)}#sideTab{position:absolute;right:var(--side);top:50%;transform:translateY(-50%);min-height:110px;padding:10px 8px;writing-mode:vertical-rl;color:#fff;background:var(--panel);border:1px solid var(--border);border-right:0;border-radius:10px 0 0 10px;z-index:1001;cursor:pointer;font-weight:700}body.side-closed #sideTab{right:0}header{display:flex;justify-content:space-between;align-items:center}header h2{margin:0}.controls{position:sticky;top:-14px;background:var(--panel);padding:12px 0 8px;z-index:3}.manage{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:8px}.btn{padding:9px;color:#fff;background:#26629f;border:1px solid #4082c1;border-radius:6px;cursor:pointer}.btn.alt{background:#292e34;border-color:#444b53}.controls input,.controls select{width:100%;padding:9px;margin-bottom:8px;color:#fff;background:#22272d;border:1px solid #414850;border-radius:6px}.store{padding:11px 3px;border-bottom:1px solid var(--border);cursor:pointer}.store:hover{background:#ffffff0b}.title{font-weight:700;font-size:14px}.muted{color:#b7bec6;font-size:12px;line-height:1.45}.status{margin-top:5px;font-size:12px;font-weight:700}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}.actions{display:flex;gap:6px;margin-top:7px}.mini{padding:5px 8px;color:#fff;background:#30363d;border:1px solid #4b535c;border-radius:5px;cursor:pointer;font-size:11px}.mini.del{background:#812d2d}.source{margin-top:5px;color:#89939e;font-size:10px;text-transform:uppercase}.legend{padding:9px;color:#fff;background:#15181bf2;border-radius:7px;line-height:1.8}.stateWrap{overflow:visible!important;background:transparent;border:0}.stateBox{position:relative;width:62px;height:62px}.badge{position:absolute;left:7px;top:7px;width:48px;height:48px;border:3px solid #fff;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;box-shadow:0 3px 9px #0009;z-index:2}.red .badge{background:var(--red)}.yellow .badge{background:#ba8e00}.gray .badge{background:var(--gray)}.code{font-weight:900}.count{font-size:11px;font-weight:800}.pulse{position:absolute;left:3px;top:3px;width:56px;height:56px;border:4px solid var(--red);border-radius:50%;animation:pulse 1.7s infinite}.yellow .pulse{border-color:var(--yellow)}@keyframes pulse{0%{transform:scale(.8);opacity:1}100%{transform:scale(1.4);opacity:0}}.exact{width:30px;height:30px;border:4px solid #fff;border-radius:50% 50% 50% 0;background:#1976d2;transform:rotate(-45deg);box-shadow:0 3px 12px #1976d2}.usa{width:36px;height:34px;background:#fff;border:2px solid #0003;border-radius:4px;font-size:10px;font-weight:800;cursor:pointer}#dashboard{position:fixed;left:0;right:var(--side);bottom:0;height:var(--dash);background:#f4f6f8;z-index:999;transform:translateY(100%);transition:.28s transform,.28s right}body.side-closed #dashboard{right:0}#dashboard.open{transform:none}#dashTab{position:absolute;top:-38px;left:50%;transform:translateX(-50%);width:180px;height:38px;color:#fff;background:var(--panel);border:1px solid var(--border);border-radius:12px 12px 0 0;cursor:pointer}#dashContent{height:100%;padding:14px;overflow:auto}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card{padding:12px;background:#fff;border:1px solid #d7dce1;border-radius:8px}.card h3{margin:0 0 7px;font-size:11px;color:#555}.card b{font-size:24px}.modalBg{display:none;position:fixed;inset:0;align-items:center;justify-content:center;padding:15px;background:#000b;z-index:20000}.modalBg.open{display:flex}.modal{width:min(750px,96vw);max-height:92vh;overflow:auto;color:#fff;background:#171a1e;border:1px solid #3a4149;border-radius:10px}.modalHead,.modalFoot{display:flex;justify-content:space-between;align-items:center;padding:14px;border-bottom:1px solid #333}.modalFoot{justify-content:flex-end;gap:8px;border-top:1px solid #333;border-bottom:0}.modalBody{padding:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.field.full{grid-column:1/-1}.field label{display:block;margin-bottom:4px;font-size:12px;font-weight:700}.field input,.field select{width:100%;padding:9px;color:#fff;background:#22272d;border:1px solid #424a54;border-radius:6px}.lookup{margin-top:8px;font-size:12px;color:#b9c1ca}.ok{color:#70d28a}.err{color:#ff9292}@media(max-width:800px){:root{--side:min(92vw,360px)}#map,#dashboard{right:0}.cards,.grid{grid-template-columns:1fr 1fr}}@media(max-width:550px){.grid,.cards{grid-template-columns:1fr}.field.full{grid-column:auto}}
</style>
</head>
<body class="side-closed">
<div id="map"></div>
<aside id="sidebar"><header><div><h2>Store Outages</h2><div id="subtitle" class="muted">Loading...</div></div><button id="closeSide" class="btn alt">&#9654;</button></header><div class="controls"><div class="manage"><button id="addBtn" class="btn">+ Add Store</button><button id="exportBtn" class="btn alt">Export Added</button></div><select id="filter"><option value="all">All Stores</option><option value="red">Active Outages</option><option value="yellow">Possible Outages</option><option value="gray">Normal Stores</option><option value="future">Future Stores</option></select><input id="search" placeholder="Search stores..."></div><div id="storeList"></div></aside>
<button id="sideTab">STORES</button>
<section id="dashboard"><button id="dashTab">&#9650; Dashboard</button><div id="dashContent"></div></section>
<div id="modalBg" class="modalBg"><div class="modal"><div class="modalHead"><h2 id="modalTitle">Add Store</h2><button id="xBtn" class="btn alt">X</button></div><form id="storeForm"><div class="modalBody"><input id="original" type="hidden"><div class="grid"><div class="field"><label>Store Number *</label><input id="fNum" required></div><div class="field"><label>Store Name *</label><input id="fName" required></div><div class="field full"><label>Street Address *</label><input id="fStreet" required></div><div class="field"><label>City *</label><input id="fCity" required></div><div class="field"><label>State *</label><input id="fState" maxlength="2" required></div><div class="field"><label>ZIP Code</label><input id="fZip"></div><div class="field"><label>Store Status</label><select id="fLife"><option>Active</option><option>Future</option><option>Temporarily Closed</option><option>Inactive</option></select></div><div class="field"><label>Planned Open Date</label><input id="fDate" type="date"></div><div class="field full"><button id="lookupBtn" class="btn" type="button">Look Up Address</button> <button id="previewBtn" class="btn alt" type="button">Preview Location</button><div id="lookupStatus" class="lookup">Coordinates and a provider suggestion will be filled when possible.</div></div><div class="field"><label>Latitude *</label><input id="fLat" type="number" step="any" required></div><div class="field"><label>Longitude *</label><input id="fLon" type="number" step="any" required></div><div class="field"><label>Provider Name</label><input id="fProvider" list="providers"><datalist id="providers"></datalist></div><div class="field"><label>Provider Outage Map</label><input id="fLink" type="url"></div></div></div><div class="modalFoot"><button id="cancelBtn" class="btn alt" type="button">Cancel</button><button class="btn" type="submit">Save Store</button></div></form></div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const CFG={manualKey:'manualStores_v1',bounds:[[24.2,-125],[49.5,-66.7]],view:[[24.5,-124.8],[49.3,-67]],zoom:13};
const CENTERS={AL:[32.8,-86.8],AZ:[34,-111.1],AR:[35,-92.4],CA:[36.8,-119.4],CO:[39.6,-105.8],CT:[41.6,-72.7],DE:[39,-75.5],FL:[27.7,-81.5],GA:[32.2,-82.9],ID:[44.1,-114.7],IL:[40.6,-89.4],IN:[40.3,-86.1],IA:[41.9,-93.1],KS:[39,-98.5],KY:[37.8,-84.3],LA:[31,-92],ME:[45.3,-69.4],MD:[39,-76.7],MA:[42.4,-71.4],MI:[44.3,-85.6],MN:[46.7,-94.7],MS:[32.4,-89.4],MO:[38,-91.8],MT:[46.9,-110.4],NE:[41.5,-99.9],NV:[38.8,-116.4],NH:[43.2,-71.6],NJ:[40.1,-74.4],NM:[34.5,-105.9],NY:[43,-75],NC:[35.8,-79],ND:[47.6,-101],OH:[40.4,-82.9],OK:[35,-97.1],OR:[43.8,-120.6],PA:[41.2,-77.2],RI:[41.6,-71.5],SC:[33.8,-80.9],SD:[44,-99.9],TN:[35.5,-86.6],TX:[32,-99.9],UT:[39.3,-111.1],VT:[44.6,-72.6],VA:[37.4,-78.7],WA:[47.4,-120.7],WV:[38.6,-80.5],WI:[43.8,-88.8],WY:[43.1,-107.3],DC:[38.9,-77]};
let map,stateLayer,exactLayer,preview,csvStores=[],stores=[],selected='';
const $=id=>document.getElementById(id),txt=v=>v==null?'':String(v).trim(),key=s=>txt(s['Site #']??s.Site??s.storeNumber).replace(/\.0$/,''),state=v=>txt(v).toUpperCase(),col=v=>['red','outage','active','down'].includes(txt(v).toLowerCase())?'red':['yellow','possible','warning'].includes(txt(v).toLowerCase())?'yellow':'gray',oper=s=>!['future','temporarily closed','inactive'].includes(txt(s['Store Status']).toLowerCase()),valid=(a,b)=>Number.isFinite(a)&&Number.isFinite(b)&&a>=-90&&a<=90&&b>=-180&&b<=180,esc=v=>String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
function parseCSV(t){let rows=[],r=[],f='',q=false;for(let i=0;i<t.length;i++){let c=t[i];if(c==='"'){if(q&&t[i+1]==='"'){f+='"';i++}else q=!q}else if(c===','&&!q){r.push(f);f=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&t[i+1]==='\n')i++;r.push(f);f='';if(r.some(x=>x.trim()))rows.push(r);r=[]}else f+=c}r.push(f);if(r.some(x=>x.trim()))rows.push(r);if(rows.length<2)return[];let h=rows[0].map(txt);return rows.slice(1).map(a=>{let o={};h.forEach((x,i)=>o[x]=txt(a[i]));o.Latitude=parseFloat(o.Latitude);o.Longitude=parseFloat(o.Longitude);return o})}
function manual(){try{return JSON.parse(localStorage.getItem(CFG.manualKey)||'[]')}catch{return[]}}function saveManual(x){localStorage.setItem(CFG.manualKey,JSON.stringify(x))}function combine(){let seen=new Set;stores=[...csvStores,...manual()].filter(s=>{let k=key(s);if(!k||seen.has(k))return false;seen.add(k);return true})}
function init(){map=L.map('map',{minZoom:4,maxZoom:18,maxBounds:CFG.bounds,maxBoundsViscosity:1});L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{noWrap:true,maxZoom:18,attribution:'&copy; OpenStreetMap'}).addTo(map);stateLayer=L.layerGroup().addTo(map);exactLayer=L.layerGroup().addTo(map);map.fitBounds(CFG.view);let U=L.Control.extend({options:{position:'topleft'},onAdd(){let b=L.DomUtil.create('button','usa');b.innerText='USA';b.onclick=()=>{selected='';exactLayer.clearLayers();map.fitBounds(CFG.view);renderAll()};return b}});map.addControl(new U);let lg=L.control({position:'bottomleft'});lg.onAdd=()=>{let d=L.DomUtil.create('div','legend');d.innerHTML='<b>State Status</b><br><span class="dot" style="background:#e53935"></span>Active Outage<br><span class="dot" style="background:#fbc02d"></span>Possible<br><span class="dot" style="background:#707780"></span>Normal';return d};lg.addTo(map)}
function summaries(){let m=new Map;stores.forEach(s=>{let st=state(s.State);if(!st)return;if(!m.has(st))m.set(st,{code:st,stores:[],active:0,possible:0,normal:0,future:0,activeStores:0});let x=m.get(st);x.stores.push(s);if(!oper(s)){if(txt(s['Store Status']).toLowerCase()==='future')x.future++;return}x.activeStores++;let c=col(s.color);c==='red'?x.active++:c==='yellow'?x.possible++:x.normal++});return m}
function renderStates(){stateLayer.clearLayers();let sm=summaries();sm.forEach(x=>{let sev=x.active?'red':x.possible?'yellow':'gray',center=CENTERS[x.code]||avg(x.stores);if(!center)return;let icon=L.divIcon({className:'stateWrap',html:`<div class="stateBox ${sev}">${sev!=='gray'?'<div class="pulse"></div>':''}<div class="badge"><span class="code">${x.code}</span><span class="count">${x.activeStores}</span></div></div>`,iconSize:[62,62],iconAnchor:[31,31]});let mk=L.marker(center,{icon,zIndexOffset:sev==='red'?30000:sev==='yellow'?20000:0,riseOnHover:true,riseOffset:50000}).addTo(stateLayer);mk.bindPopup(`<b>${x.code}</b><br>Active stores: ${x.activeStores}<br>Future stores: ${x.future}<br>Active outages: ${x.active}<br>Possible: ${x.possible}`);mk.on('click',()=>{selected=x.code;$('search').value='';$('filter').value='all';renderList();openSide();map.setView(center,6)})})}
function avg(a){let v=a.filter(s=>valid(+s.Latitude,+s.Longitude));return v.length?[v.reduce((n,s)=>n+(+s.Latitude),0)/v.length,v.reduce((n,s)=>n+(+s.Longitude),0)/v.length]:null}
function list(){let q=$('search').value.toLowerCase(),f=$('filter').value;return stores.filter(s=>(!selected||state(s.State)===selected)&&(!q||[key(s),s.SiteName,s.Location,s.City,s.State,s['Vendor Name']].map(txt).join(' ').toLowerCase().includes(q))&&(f==='all'||f==='future'&&txt(s['Store Status']).toLowerCase()==='future'||f===col(s.color)))}
function renderList(){$('storeList').innerHTML='';let a=list();$('subtitle').innerText=`${a.length} ${selected?selected:'stores'}`;a.forEach(s=>{let d=document.createElement('div');d.className='store';let c=col(s.color),manualStore=s.source==='manual';d.innerHTML=`<div class="title">Store ${esc(key(s))} - ${esc(s.SiteName)}</div><div class="muted">${esc(s.Location)}<br>${esc(s.City)}, ${esc(s.State)}</div><div class="status"><span class="dot" style="background:${c==='red'?'#e53935':c==='yellow'?'#fbc02d':'#707780'}"></span>${esc(s.status||c)}</div><div class="source">${manualStore?'Manually added':'Sites.csv'}</div>${manualStore?'<div class="actions"><button class="mini edit">Edit</button><button class="mini del">Delete</button></div>':''}`;d.onclick=e=>{if(!e.target.closest('button'))focus(s)};if(manualStore){d.querySelector('.edit').onclick=e=>{e.stopPropagation();openForm(s)};d.querySelector('.del').onclick=e=>{e.stopPropagation();removeStore(s)}};$('storeList').appendChild(d)})}
function focus(s){let a=+s.Latitude,b=+s.Longitude;if(!valid(a,b))return alert('This store has invalid coordinates.');exactLayer.clearLayers();let icon=L.divIcon({className:'',html:'<div class="exact"></div>',iconSize:[38,38],iconAnchor:[19,34]});let m=L.marker([a,b],{icon,zIndexOffset:60000}).addTo(exactLayer);m.bindPopup(`<b>Store ${esc(key(s))} - ${esc(s.SiteName)}</b><br>${esc(s.Location)}<br>${esc(s.City)}, ${esc(s.State)}<br><b>Status:</b> ${esc(s.status||col(s.color))}`).openPopup();map.setView([a,b],CFG.zoom)}
function renderDash(){let active=stores.filter(oper),future=stores.filter(s=>txt(s['Store Status']).toLowerCase()==='future'),red=active.filter(s=>col(s.color)==='red'),yellow=active.filter(s=>col(s.color)==='yellow');$('dashContent').innerHTML=`<div class="cards"><div class="card"><h3>ACTIVE STORES</h3><b>${active.length}</b></div><div class="card"><h3>ACTIVE OUTAGES</h3><b style="color:#d32f2f">${red.length}</b></div><div class="card"><h3>POSSIBLE OUTAGES</h3><b style="color:#a77e00">${yellow.length}</b></div><div class="card"><h3>FUTURE STORES</h3><b>${future.length}</b></div></div>`}
function renderAll(){combine();renderStates();renderList();renderDash();providers()}
function openSide(){document.body.classList.remove('side-closed');setTimeout(()=>map.invalidateSize(),300)}
function openForm(s=null){$('modalTitle').innerText=s?`Edit Store ${key(s)}`:'Add Store';$('original').value=s?key(s):'';$('fNum').value=s?key(s):'';$('fName').value=s?txt(s.SiteName):'';$('fStreet').value=s?txt(s.Location):'';$('fCity').value=s?txt(s.City):'';$('fState').value=s?state(s.State):'';$('fZip').value=s?txt(s.ZIP||s.Zip):'';$('fLat').value=s?s.Latitude:'';$('fLon').value=s?s.Longitude:'';$('fProvider').value=s?txt(s['Vendor Name']):'';$('fLink').value=s?txt(s['Vendor Link']||s.providerWebsite):'';$('fLife').value=s?txt(s['Store Status'])||'Active':'Active';$('fDate').value=s?txt(s['Planned Open Date']):'';$('lookupStatus').innerText='Coordinates and a provider suggestion will be filled when possible.';$('modalBg').classList.add('open')}
function closeForm(){$('modalBg').classList.remove('open');if(preview){map.removeLayer(preview);preview=null}}
function record(){return {'Site #':txt($('fNum').value),'SiteName':txt($('fName').value),Location:txt($('fStreet').value),City:txt($('fCity').value),State:state($('fState').value),ZIP:txt($('fZip').value),Latitude:+$('fLat').value,Longitude:+$('fLon').value,'Vendor Name':txt($('fProvider').value),'Vendor Link':txt($('fLink').value),providerWebsite:txt($('fLink').value),'Store Status':$('fLife').value,'Planned Open Date':$('fDate').value,color:'gray',status:'No outage',source:'manual'}}
function saveForm(e){e.preventDefault();let r=record(),orig=$('original').value;if(!valid(r.Latitude,r.Longitude))return alert('Valid coordinates are required.');if(stores.some(s=>key(s)===key(r)&&key(s)!==orig))return alert('That store number already exists.');let a=manual().filter(s=>key(s)!==orig);a.push(r);saveManual(a);closeForm();selected=r.State;renderAll();openSide();focus(r)}
function removeStore(s){if(confirm(`Delete Store ${key(s)} - ${s.SiteName}?`)){saveManual(manual().filter(x=>key(x)!==key(s)));exactLayer.clearLayers();renderAll()}}
async function geocode(){let st=$('lookupStatus');st.className='lookup';st.innerText='Looking up address...';let p=new URLSearchParams({street:$('fStreet').value,city:$('fCity').value,state:$('fState').value,zip:$('fZip').value,benchmark:'Public_AR_Current',format:'json'});try{let r=await fetch('https://geocoding.geo.census.gov/geocoder/locations/address?'+p),j=await r.json(),m=j?.result?.addressMatches?.[0];if(!m)throw Error('No match found');let a=+m.coordinates.y,b=+m.coordinates.x;$('fLat').value=a.toFixed(6);$('fLon').value=b.toFixed(6);let near=stores.filter(s=>state(s.State)===state($('fState').value)&&txt(s['Vendor Name'])&&valid(+s.Latitude,+s.Longitude)).sort((x,y)=>Math.hypot(+x.Latitude-a,+x.Longitude-b)-Math.hypot(+y.Latitude-a,+y.Longitude-b))[0];if(near){$('fProvider').value=near['Vendor Name'];$('fLink').value=near['Vendor Link']||near.providerWebsite||''}st.className='lookup ok';st.innerText=`Matched: ${m.matchedAddress}. ${near?'Provider suggested from the nearest existing store; verify before saving.':'Enter provider manually.'}`;previewPoint()}catch(e){st.className='lookup err';st.innerText='Lookup failed: '+e.message+'. Enter coordinates manually.'}}
function previewPoint(){let a=+$('fLat').value,b=+$('fLon').value;if(!valid(a,b))return alert('Enter valid coordinates.');if(preview)map.removeLayer(preview);preview=L.marker([a,b],{draggable:true}).addTo(map);preview.on('dragend',()=>{let p=preview.getLatLng();$('fLat').value=p.lat.toFixed(6);$('fLon').value=p.lng.toFixed(6)});map.setView([a,b],15)}
function providers(){let d=$('providers');d.innerHTML='';let seen=new Set;stores.forEach(s=>{let n=txt(s['Vendor Name']);if(n&&!seen.has(n)){seen.add(n);let o=document.createElement('option');o.value=n;d.appendChild(o)}})}
function exportStores(){let a=manual();if(!a.length)return alert('No manually added stores.');let h=['Site #','SiteName','Location','City','State','ZIP','Latitude','Longitude','Vendor Name','Vendor Link','Store Status','Planned Open Date'],q=v=>'"'+String(v??'').replaceAll('"','""')+'"',csv=[h.map(q).join(','),...a.map(r=>h.map(x=>q(r[x])).join(','))].join('\r\n'),u=URL.createObjectURL(new Blob([csv],{type:'text/csv'})),x=document.createElement('a');x.href=u;x.download='manual-stores.csv';x.click();setTimeout(()=>URL.revokeObjectURL(u),500)}
$('sideTab').onclick=()=>document.body.classList.contains('side-closed')?openSide():document.body.classList.add('side-closed');$('closeSide').onclick=()=>document.body.classList.add('side-closed');$('filter').onchange=renderList;$('search').oninput=renderList;$('addBtn').onclick=()=>openForm();$('exportBtn').onclick=exportStores;$('xBtn').onclick=closeForm;$('cancelBtn').onclick=closeForm;$('storeForm').onsubmit=saveForm;$('lookupBtn').onclick=geocode;$('previewBtn').onclick=previewPoint;$('dashTab').onclick=()=>{let d=$('dashboard'),o=!d.classList.contains('open');d.classList.toggle('open',o);document.body.classList.toggle('dash-open',o);$('dashTab').innerText=(o?'▼':'▲')+' Dashboard';setTimeout(()=>map.invalidateSize(),300)};
async function start(){init();try{let [c,o]=await Promise.all([fetch('Sites.csv',{cache:'no-store'}).then(r=>r.text()),fetch('outages.json',{cache:'no-store'}).then(r=>r.json()).catch(()=>[])]);let outs=Array.isArray(o)?o:o.outages||[],look=new Map(outs.map(x=>[key(x),x]));csvStores=parseCSV(c).map(s=>{let x=look.get(key(s));return {...s,color:col(x?.color),status:x?.status||'No outage',providerWebsite:x?.providerWebsite||s['Vendor Link'],source:'csv'}});renderAll()}catch(e){$('subtitle').innerText='Data load failed';$('storeList').innerHTML='<div class="muted">Keep index.html, Sites.csv, and outages.json in the same web-server folder.</div>';openSide()}}start();
</script></body></html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Store Outage Map</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
        }

        #map {
            flex: 1;
            height: 100%;
        }

        #sidebar {
            width: 320px;
            background: #1e1e1e;
            color: white;
            border-left: 1px solid #444;
            padding: 10px;
            overflow-y: auto;
            height: 100%;
            transition: transform 0.3s ease;
            position: absolute;
            right: 0;
            top: 0;
            bottom: 0;
            z-index: 9999;
        }

        #sidebar.collapsed {
            transform: translateX(100%);
        }

        #collapseBubble {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #1e1e1e;
            color: white;
            border: 1px solid #444;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: none;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 10000;
            font-size: 22px;
        }

        #sidebar.collapsed + #collapseBubble {
            display: flex;
        }

        #sidebarHeader {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #toggleBtn {
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            padding: 0;
            margin: 0 8px 0 0;
            color: white;
        }

        #viewSelect {
            background: #2b2b2b;
            color: white;
            border: 1px solid #666;
            padding: 6px 8px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
        }

        #filterSelect, #searchBar {
            width: 95%;
            padding: 8px;
            margin: 10px 0;
            border-radius: 6px;
            border: 1px solid #666;
            background: #2b2b2b;
            color: white;
        }

        .store-item {
            padding: 8px;
            margin: 6px 0;
            background: #2b2b2b;
            border-radius: 6px;
            cursor: pointer;
            border: 1px solid #555;
            color: white;
        }

        .store-item:hover {
            background: #3a3a3a;
        }

        #errorMessage {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #d32f2f;
            color: white;
            padding: 15px 20px;
            border-radius: 6px;
            display: none;
            z-index: 10001;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }

        #updateNotification {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #1976d2;
            color: white;
            padding: 15px 20px;
            border-radius: 6px;
            display: none;
            z-index: 10001;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
    </style>
</head>

<body>

<div id="map"></div>

<div id="sidebar">
    <div id="sidebarHeader">
        <div style="display:flex;align-items:center;">
            <h2 style="margin:0 10px 0 0;">All Stores</h2>
            <button id="toggleBtn">▼</button>
        </div>
        <!-- Right-side default view button -->
        <button id="defaultViewBtn" title="Reset to default view" style="background:#2b2b2b;color:white;border:1px solid #666;padding:6px 8px;border-radius:6px;font-size:14px;cursor:pointer;">Default view</button>
    </div>

    <select id="filterSelect">
        <option value="all">All Stores</option>
        <option value="outages">Outages Only (Red + Yellow)</option>
    </select>

    <input id="searchBar" type="text" placeholder="Search store #, name, city...">

    <div id="storeList"></div>
</div>

<div id="collapseBubble">►</div>
<div id="errorMessage"></div>
<div id="updateNotification">Map data updated. Reloading...</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
// Show error message
function showError(message) {
    const errorDiv = document.getElementById("errorMessage");
    errorDiv.textContent = message;
    errorDiv.style.display = "block";
    setTimeout(() => {
        errorDiv.style.display = "none";
    }, 5000);
}

// Show update notification
function showUpdateNotification() {
    const notifDiv = document.getElementById("updateNotification");
    notifDiv.style.display = "block";
    setTimeout(() => {
        location.reload();
    }, 2000);
}

Promise.all([
    fetch("Sites-small.csv").then(r => {
        if (!r.ok) throw new Error(`Failed to load Sites-small.csv: ${r.status}`);
        return r.text();
    }),
    fetch("outages.json").then(r => {
        if (!r.ok) throw new Error(`Failed to load outages.json: ${r.status}`);
        return r.json();
    })
]).then(([csvText, outages]) => {
    const stores = parseCSV(csvText);
    if (stores.length === 0) {
        throw new Error("No valid stores found in CSV data");
    }
    mergeOutageData(stores, outages);
    initMap(stores);
}).catch(err => {
    console.error("Fatal error:", err);
    showError(`Error loading map data: ${err.message}`);
    document.getElementById("map").innerHTML = `
        <div style="display:flex;align-items:center;justify-content:center;height:100%;color:#d32f2f;font-size:18px;">
            <div style="text-align:center;">
                <p>Failed to load map data</p>
                <p style="font-size:14px;">${err.message}</p>
                <button onclick="location.reload()" style="padding:10px 20px;margin-top:10px;background:#d32f2f;color:white;border:none;border-radius:4px;cursor:pointer;">
                    Retry
                </button>
            </div>
        </div>
    `;
});

function parseCSV(text) {
    if (!text || text.trim().length === 0) {
        throw new Error("CSV file is empty");
    }

    const lines = text.trim().split("\n").filter(line => line.trim());

    if (lines.length < 2) {
        throw new Error("CSV file must contain headers and at least one data row");
    }

    // Split headers safely
    const headerLine = lines[0];
    const headers = headerLine
        .match(/(".*?"|[^",]+)(?=\s*,|\s*$)/g)
        .map(h => h.replace(/"/g, "").trim());

    if (headers.length === 0) {
        throw new Error("Invalid CSV headers");
    }

    return lines.slice(1).map((line, rowIndex) => {
        if (!line.trim()) return null;

        // Split respecting quoted commas
        const cols = line.match(/(".*?"|[^",]+)(?=\s*,|\s*$)/g);
        if (!cols || cols.length === 0) {
            console.warn(`Skipping row ${rowIndex + 2}: unable to parse`);
            return null;
        }

        let obj = {};
        headers.forEach((h, i) => {
            obj[h] = cols[i]?.replace(/"/g, "").trim() || "";
        });

        // Validate required fields
        if (!obj["Site #"] || !obj.SiteName) {
            console.warn(`Skipping row ${rowIndex + 2}: missing required fields`);
            return null;
        }

        // Clean coordinates
        let rawLat = (obj.Latitude || "").replace(/[^\d\.\-]/g, "").trim();
        let rawLon = (obj.Longitude || "").replace(/[^\d\.\-]/g, "").trim();

        obj.Latitude = parseFloat(rawLat) || NaN;
        obj.Longitude = parseFloat(rawLon) || NaN;

        return obj;
    }).filter(Boolean);
}

function mergeOutageData(stores, outages) {
    if (!Array.isArray(outages)) {
        console.warn("Outages data is not an array, treating all stores as no outage");
        outages = [];
    }

    stores.forEach(store => {
        const match = outages.find(o => o.storeNumber == store["Site #"]);

        if (match) {
            store.color = match.color || "white";
            store.status = match.status || "Unknown";
            store.distanceMiles = match.distanceMiles || "";
            store.outageLat = match.outageLat || "";
            store.outageLon = match.outageLon || "";
            store.etr = match.etr || "";
            store.lastUpdated = match.lastUpdated || "";
            store.providerWebsite = match.providerWebsite || "";
        } else {
            store.color = "white";
            store.status = "No outage";
            store.distanceMiles = "";
            store.outageLat = "";
            store.outageLon = "";
            store.etr = "";
            store.lastUpdated = "";
            store.providerWebsite = store["Vendor Link"] || "";
        }
    });
}

function initMap(stores) {
    // default USA view
    const USA_CENTER = [37.5, -95.5];
    const USA_ZOOM = 5;

    let map = L.map("map").setView(USA_CENTER, USA_ZOOM);

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(map);

    const iconColors = {
        red: "https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-red.png",
        yellow: "https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-yellow.png",
        white: "https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-grey.png"
    };

    let markers = {};
    let circles = {}; // store shaded outage circle overlays per store
    let skippedCount = 0;

    stores.forEach(store => {
        let lat = store.outageLat ? parseFloat(store.outageLat) : store.Latitude;
        let lon = store.outageLon ? parseFloat(store.outageLon) : store.Longitude;

        if (isNaN(lat) || isNaN(lon)) {
            console.warn("Skipping store due to invalid coordinates:", store["Site #"], lat, lon);
            skippedCount++;
            return;
        }

        // Fallback for unknown colors
        const markerColor = store.color && iconColors[store.color] ? store.color : "white";

        let icon = L.icon({
            iconUrl: iconColors[markerColor],
            shadowUrl: "https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png",
            iconSize: [25, 41],
            iconAnchor: [12, 41],
            popupAnchor: [1, -34]
        });

        let marker = L.marker([lat, lon], { icon });

        // Build popup content without showing raw coordinates and include outage/vendor link
        const outageLinkHTML = store.providerWebsite ? `\n            <b>Outage Map:</b> <a href=\"${store.providerWebsite}\" target=\"_blank\" rel=\"noopener noreferrer\">View Outage/Provider Site</a><br>` : "";

        const addressHTML = store.Location ? `\n            <b>Address:</b> ${store.Location}<br>` : "";

        marker.bindPopup(`
            <b>Store ${store["Site #"].replace(/^0+/, "")} – ${store.SiteName}</b><br>
            ${addressHTML}
            ${store.City}, ${store.State}<br><br>

            <b>Status:</b> ${store.status}<br>
            <b>ETA:</b> ${store.etr || "N/A"}<br>
            <b>Last Updated:</b> ${store.lastUpdated || "N/A"}<br>
            <b>Distance to Outage:</b> ${store.distanceMiles || "N/A"}<br><br>

            ${outageLinkHTML}
        `);

        marker.addTo(map);
        markers[store["Site #"]] = marker;

        // If we have a numeric distance (in miles) and the store is marked as an outage, draw a faded shaded circle
        const miles = parseFloat(store.distanceMiles);
        if (!isNaN(miles) && miles > 0 && store.color && store.color !== "white") {
            // choose center: prefer outage location if provided, else store location
            const centerLat = (store.outageLat && !isNaN(parseFloat(store.outageLat))) ? parseFloat(store.outageLat) : store.Latitude;
            const centerLon = (store.outageLon && !isNaN(parseFloat(store.outageLon))) ? parseFloat(store.outageLon) : store.Longitude;

            if (!isNaN(centerLat) && !isNaN(centerLon)) {
                const radiusMeters = miles * 1609.34; // miles -> meters
                const fillColor = store.color === 'red' ? '#ff0000' : (store.color === 'yellow' ? '#ffea00' : '#999');

                const circle = L.circle([centerLat, centerLon], {
                    radius: radiusMeters,
                    color: fillColor,
                    weight: 1,
                    fillColor: fillColor,
                    fillOpacity: 0.12,
                    interactive: false
                }).addTo(map);

                circles[store["Site #"]] = circle;
            }
        }
    });

    if (skippedCount > 0) {
        console.warn(`${skippedCount} stores skipped due to invalid data`);
    }

    let storeListDiv = document.getElementById("storeList");
    let filterSelect = document.getElementById("filterSelect");

    function renderStoreList(filterText = "") {
        storeListDiv.innerHTML = "";

        const filteredStores = stores
            .filter(store => {
                if (filterSelect.value === "outages" && store.color === "white") {
                    return false;
                }

                if (!filterText) return true;

                const siteNum = (store["Site #"] || "").toLowerCase();
                const siteName = (store.SiteName || "").toLowerCase();
                const city = (store.City || "").toLowerCase();

                return (
                    siteNum.includes(filterText) ||
                    siteName.includes(filterText) ||
                    city.includes(filterText)
                );
            });

        if (filteredStores.length === 0) {
            storeListDiv.innerHTML = `<div style="padding: 10px; color: #999; text-align: center;">No stores found</div>`;
            return;
        }

        filteredStores.forEach(store => {
            let div = document.createElement("div");
            div.className = "store-item";

            // Include outage/vendor link in the list as well (small clickable text)
            const listLink = store.providerWebsite ? `<div style="margin-top:6px;"><a href=\"${store.providerWebsite}\" target=\"_blank\" rel=\"noopener noreferrer\" style=\"color:#9ec9ff;\">Open Outage/Provider Map</a></div>` : "";

            div.innerHTML = `
                <b>${store["Site #"].replace(/^0+/, "")} – ${store.SiteName}</b><br>
                ${store.City}, ${store.State}<br>
                <span style="color:${store.color || "white"}">● ${(store.color || "white").toUpperCase()}</span>
                ${listLink}
            `;

            div.onclick = () => {
                let marker = markers[store["Site #"]];
                if (marker) {
                    map.setView(marker.getLatLng(), 14);
                    marker.openPopup();
                } else {
                    console.warn("Marker not found for store:", store["Site #"]);
                }
            };

            storeListDiv.appendChild(div);
        });
    }

    renderStoreList();

    document.getElementById("searchBar").addEventListener("input", e => {
        renderStoreList(e.target.value.toLowerCase());
    });

    filterSelect.addEventListener("change", () => {
        renderStoreList(document.getElementById("searchBar").value.toLowerCase());
    });

    const sidebar = document.getElementById("sidebar");
    const toggleBtn = document.getElementById("toggleBtn");
    const collapseBubble = document.getElementById("collapseBubble");

    toggleBtn.onclick = () => {
        sidebar.classList.add("collapsed");
    };

    collapseBubble.onclick = () => {
        sidebar.classList.remove("collapsed");
    };

    // Default view button handling (reset to USA view)
    const defaultViewBtn = document.getElementById("defaultViewBtn");
    defaultViewBtn.addEventListener("click", () => {
        map.setView(USA_CENTER, USA_ZOOM);
    });

    let legend = L.control({ position: "bottomleft" });

    legend.onAdd = function () {
        let div = L.DomUtil.create("div", "legend");

        div.style.background = "#1e1e1e";
        div.style.color = "white";
        div.style.padding = "10px";
        div.style.borderRadius = "6px";
        div.style.lineHeight = "1.6";
        div.style.boxShadow = "0 0 5px rgba(0,0,0,0.4)";

        div.innerHTML = `
            <div style="display:flex;align-items:center;">
                <span style="background:red;width:14px;height:14px;display:inline-block;margin-right:8px;border-radius:3px;"></span>
                Outage (0–0.5 miles)
            </div>

            <div style="display:flex;align-items:center;">
                <span style="background:yellow;width:14px;height:14px;display:inline-block;margin-right:8px;border-radius:3px;"></span>
                Possible Outage (0.5–1 mile)
            </div>

            <div style="display:flex;align-items:center;">
                <span style="background:white;width:14px;height:14px;display:inline-block;margin-right:8px;border-radius:3px;border:1px solid #999;"></span>
                No Outage
            </div>
        `;

        return div;
    };

    legend.addTo(map);

    let lastHash = null;

    async function checkForUpdate() {
        try {
            const response = await fetch("outages.json", { cache: "no-store" });
            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }

            const text = await response.text();
            const hash = btoa(text);

            if (lastHash && lastHash !== hash) {
                console.log("Map data updated, reloading...");
                showUpdateNotification();
            }

            lastHash = hash;

        } catch (err) {
            console.warn("Auto-refresh check failed:", err);
            // Don't show error to user, just log it
        }
    }

    // Check for updates every 30 seconds
    setInterval(checkForUpdate, 30000);
    // Initial check after 5 seconds
    setTimeout(checkForUpdate, 5000);
}
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Store Outage Map — NOAA NowCOAST + RainViewer + Scaled Markers</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <style>
    html,body { height:100%; margin:0; padding:0; font-family:Arial, sans-serif; background:#0f0f0f; color:#fff; }
    /* Map and sidebar layout */
    #map { position:absolute; top:0; left:0; right:360px; bottom:0; transition:right 0.28s ease; z-index:1; }
    #sidebar { position:absolute; top:0; right:0; width:360px; bottom:0; background:#151515; border-left:1px solid #2b2b2b; padding:12px; overflow-y:auto; z-index:10000; transition: transform 0.28s ease; transform: translateX(0); }
    body.sidebar-collapsed #sidebar { transform: translateX(100%); }
    #sidebarHeader { display:flex; align-items:center; justify-content:space-between; gap:8px; }
    .header-btn { background:#222; color:#fff; border:1px solid #333; padding:6px 8px; border-radius:6px; cursor:pointer; }
    #filterSelect, #searchBar { width:100%; padding:8px; margin:10px 0; border-radius:6px; border:1px solid #333; background:#1b1b1b; color:#fff; }
    .store-item { background:#1b1b1b; border:1px solid #2b2b2b; padding:8px; margin:6px 0; border-radius:6px; cursor:pointer; color:#fff; }
    .store-item:hover { background:#262626; }
    #collapseBubble { position:absolute; top:12px; right:12px; width:40px; height:40px; border-radius:50%; background:#151515; border:1px solid #333; display:none; align-items:center; justify-content:center; cursor:pointer; z-index:10001; color:#fff; font-size:18px; }
    body.sidebar-collapsed #collapseBubble { display:flex; }
    #bottomDashboard { position:fixed; left:0; right:0; bottom:0; height:320px; transform:translateY(100%); transition: transform 0.28s ease; background:#fff; color:#000; z-index:9999; border-top:1px solid #ccc; }
    #bottomDashboard.expanded { transform:translateY(0); }
    #dashboardHandle { position:absolute; top:-36px; left:50%; transform:translateX(-50%); width:160px; height:36px; border-radius:18px 18px 0 0; background:#151515; color:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer; border:1px solid #333; z-index:10002; }
    #dashboardContent { padding:12px; height:100%; overflow:auto; }
    .dash-cards { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
    .dash-card { background:#fff; color:#000; padding:10px; border-radius:6px; flex:1 1 48%; min-width:120px; border:1px solid #ddd; }
    .dash-list-item { padding:6px 0; border-bottom:1px dashed #ddd; cursor:pointer; }

    /* Vertical radar control (below zoom control) */
    .radar-vertical { display:flex; flex-direction:column; align-items:center; gap:8px; padding:6px; background:rgba(20,20,20,0.95); border-radius:6px; box-shadow:0 1px 6px rgba(0,0,0,0.4); color:#fff; }
    .radar-vertical input[type="range"] {
      -webkit-appearance: slider-vertical;
      width: 8px;
      height: 120px;
      transform: none;
      background: transparent;
    }
    .radar-vertical button { background:#1a73e8; color:#fff; border:none; padding:6px 8px; border-radius:4px; cursor:pointer; font-size:13px; }
    .leaflet-top.leaflet-left .radar-vertical-container { margin-top: 88px; margin-left: 8px; } /* push below zoom control */
    @media (max-width:800px) { #map { right:0; } #sidebar { width:100%; right:0; } .leaflet-top.leaflet-left .radar-vertical-container { margin-top: 8px; } }

    /* Marker pulse for outages */
    .leaflet-marker-icon.pulse {
      animation: pulse 1s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.12); }
      100% { transform: scale(1); }
    }

    /* Legend */
    .legend { font-size:13px; }
  </style>
</head>
<body>

  <div id="map"></div>

  <!-- Sidebar -->
  <div id="sidebar" role="complementary" aria-label="Store list">
    <div id="sidebarHeader">
      <h3 style="margin:0;">All Stores</h3>
      <div style="display:flex; gap:6px; align-items:center;">
        <button id="resetStateBtn" class="header-btn">All USA</button>
        <button id="toggleBtn" class="header-btn" aria-expanded="true">▸</button>
      </div>
    </div>

    <select id="filterSelect">
      <option value="all">All Stores</option>
      <option value="outages">Outages Only</option>
    </select>

    <input id="searchBar" placeholder="Search store #, name, city..." />

    <div id="storeList"></div>
  </div>

  <div id="collapseBubble" title="Show sidebar">◂</div>

  <div id="bottomDashboard">
    <div id="dashboardHandle">▲ Dashboard</div>
    <div id="dashboardContent"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <script>
  /* Full index: NOAA NowCOAST attempt, higher zoom (street level), default whole-USA view,
     All Stores button resets to whole USA, marker scaling by zoom, proxy-ready WMS fallback,
     and robust marker parsing/placement.
  */

  const SNAPSHOT_KEY = 'outageSnapshots_v1';

  function safeGetItem(k){ try { return localStorage.getItem(k); } catch { return null; } }
  function safeSetItem(k,v){ try { localStorage.setItem(k,v); } catch {} }

  function parseCSV(text){
    if(!text) return [];
    const lines = text.trim().split("\n").filter(Boolean);
    if(!lines.length) return [];
    const headers = lines[0].split(",").map(h=>h.trim());
    return lines.slice(1).map(line=>{
      const cols = line.split(",");
      const obj = {};
      headers.forEach((h,i)=> obj[h] = (cols[i]||"").trim());
      obj.Latitude = parseFloat(obj.Latitude) || NaN;
      obj.Longitude = parseFloat(obj.Longitude) || NaN;
      return obj;
    });
  }

  let stores = [];
  let map = null;
  let markers = {};
  let outageLayer, storeLayer, weatherLayer, hazardLayer;
  let trendChart = null;

  function renderStoreList(filterText = ""){
    const storeListDiv = document.getElementById("storeList");
    if(!storeListDiv) return;
    storeListDiv.innerHTML = "";
    const q = (filterText || "").toLowerCase();
    const filterSelect = document.getElementById("filterSelect");
    const filtered = stores.filter(s => {
      if(filterSelect && filterSelect.value === "outages" && s.color === "white") return false;
      const site = String(s["Site #"] || "").toLowerCase();
      const name = String(s.SiteName || "").toLowerCase();
      const city = String(s.City || "").toLowerCase();
      return !q || site.includes(q) || name.includes(q) || city.includes(q);
    });

    filtered.forEach(store => {
      const div = document.createElement("div");
      div.className = "store-item";
      div.innerHTML = `
        <b>${store["Site #"]} – ${store.SiteName || ""}</b><br>
        ${store.Location || "N/A"}<br>
        ${store.City || ""}, ${store.State || ""}<br>
        <span style="color:${store.color}">● ${String(store.color).toUpperCase()}</span>
        ${store.providerWebsite ? `<br><a href="${store.providerWebsite}" target="_blank" style="color:#1a73e8;">Outage Map</a>` : ""}
      `;
      div.onclick = () => {
        const entry = markers[String(store["Site #"])];
        if(entry && entry.marker) { map.setView(entry.marker.getLatLng(), 16); entry.marker.openPopup(); }
      };
      storeListDiv.appendChild(div);
    });
  }

  function renderDashboard(storesForDash){
    const container = document.getElementById("dashboardContent");
    if(!container) return;
    container.innerHTML = "";
    const list = storesForDash || stores;
    const outageStores = list.filter(s => s.color !== "white");
    const byState = {}, byProvider = {};
    outageStores.forEach(s => { byState[s.State] = (byState[s.State]||0)+1; byProvider[s["Vendor Name"]] = (byProvider[s["Vendor Name"]]||0)+1; });

    container.innerHTML += `
      <div class="dash-cards">
        <div class="dash-card"><h3>Total Stores</h3><p>${list.length}</p></div>
        <div class="dash-card"><h3>Current Outages</h3><p>${outageStores.length}</p></div>
        <div class="dash-card"><h3>Unique Providers</h3><p>${Object.keys(byProvider).length}</p></div>
        <div class="dash-card"><h3>Last Snapshot</h3><p>${new Date().toLocaleString()}</p></div>
      </div>
      <h3>Outages by State</h3><div id="byState" class="dash-list"></div>
      <h3>Outages by Provider</h3><div id="byProvider" class="dash-list"></div>
      <h3>24–48h Outage Trend</h3><canvas id="trendChart" width="320" height="160"></canvas>
    `;

    const stateDiv = document.getElementById("byState");
    Object.entries(byState).forEach(([st,cnt])=>{
      const el = document.createElement("div");
      el.className = "dash-list-item";
      el.textContent = `${st}: ${cnt}`;
      stateDiv.appendChild(el);
    });

    const provDiv = document.getElementById("byProvider");
    Object.entries(byProvider).forEach(([p,cnt])=> provDiv.innerHTML += `<div class="dash-list-item">${p}: ${cnt}</div>`);

    try {
      const snaps = JSON.parse(safeGetItem(SNAPSHOT_KEY) || "[]");
      const labels = snaps.map(s => new Date(s.ts).toLocaleString());
      const data = snaps.map(s => s.count);
      const ctx = document.getElementById("trendChart").getContext("2d");
      if(trendChart) trendChart.destroy();
      trendChart = new Chart(ctx, { type:"line", data:{ labels, datasets:[{ label:"Active outages", data, backgroundColor:"rgba(255,99,132,0.2)", borderColor:"rgba(255,99,132,1)", tension:0.3 }] } });
    } catch(e){}
  }

  function initMapAndLayers(){
    // Increase map maxZoom to street level
    const MIN_Z = 3;
    const MAX_Z = 19; // allow street-level zoom

    // Default view: whole USA
    const USA_CENTER = [39.0, -98.0];
    const USA_ZOOM = 4;

    map = L.map("map", { minZoom: MIN_Z, maxZoom: MAX_Z }).setView(USA_CENTER, USA_ZOOM);
    window.map = map;

    // create panes
    map.createPane('tilePane');
    map.createPane('storePane'); map.getPane('storePane').style.zIndex = 450;
    map.createPane('markerPane'); map.getPane('markerPane').style.zIndex = 500;
    map.createPane('radarPane'); map.getPane('radarPane').style.zIndex = 610; map.getPane('radarPane').style.pointerEvents = 'none';

    // base map (OSM) with high zoom
    const osm = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: '&copy; OpenStreetMap contributors',
      maxZoom: MAX_Z
    }).addTo(map);

    outageLayer = L.layerGroup([], { pane: 'markerPane' }).addTo(map);
    weatherLayer = L.layerGroup([], { pane: 'markerPane' }).addTo(map);
    storeLayer = L.layerGroup([], { pane: 'storePane' }).addTo(map);
    hazardLayer = L.layerGroup([], { pane: 'markerPane' }).addTo(map);

    // main layer control
    window._customLayerControl = L.control.layers({ "Street Map": osm }, { "Outages": outageLayer, "Weather Alerts": weatherLayer, "HazardNow": hazardLayer }, { position: "topleft" }).addTo(map);

    const legend = L.control({ position: "bottomleft" });
    legend.onAdd = function(){
      const d = L.DomUtil.create("div","legend");
      d.style.background = "#151515"; d.style.color = "#fff"; d.style.padding = "8px"; d.style.borderRadius = "6px";
      d.innerHTML = `<div style="display:flex;align-items:center;"><span style="background:red;width:14px;height:14px;display:inline-block;margin-right:8px;border-radius:3px;"></span>Outage</div>
                     <div style="display:flex;align-items:center;"><span style="background:yellow;width:14px;height:14px;display:inline-block;margin-right:8px;border-radius:3px;"></span>Possible</div>
                     <div style="display:flex;align-items:center;"><span style="background:#6b6b6b;width:14px;height:14px;display:inline-block;margin-right:8px;border-radius:3px;"></span>No Outage</div>`;
      return d;
    };
    legend.addTo(map);

    // load weather alerts (NWS)
    (async function loadWeatherAlerts(){
      try {
        const r = await fetch("https://api.weather.gov/alerts/active");
        const data = await r.json();
        weatherLayer.clearLayers();
        (data.features || []).forEach(alert => {
          if(!alert.geometry) return;
          L.geoJSON(alert.geometry, { style:{ color:"#ff6600", weight:2, fillOpacity:0.12 } })
            .bindPopup(`<b>${alert.properties?.event || "Alert"}</b><br>${alert.properties?.areaDesc || ""}`)
            .addTo(weatherLayer);
        });
      } catch(e){
        console.warn("NWS alerts load failed", e);
      }
    })();

    // --- Attempt NOAA NowCOAST WMS (with proxy fallback) ---
    // Note: NowCOAST WMS endpoints often block direct browser requests; use a server proxy if you see CORS/403.
    // Two options: direct WMS (may 403) or proxied path '/proxy/wms' (recommended for production).
    const NOWCOAST_WMS_BASE = 'https://nowcoast.noaa.gov/wms/com.esri.wms.Esrimap/obs';
    const PROXY_WMS_BASE = '/proxy/wms'; // implement server-side proxy to avoid CORS if needed

    // Create a WMS layer function that prefers direct but can be switched to proxy by toggling useProxy
    const useProxy = false; // set true if direct requests are blocked in your environment
    const wmsUrl = useProxy ? PROXY_WMS_BASE : NOWCOAST_WMS_BASE;

    // Example layer: NEXRAD Reflectivity (adjust LAYERS param if needed)
    const nowcoastWms = L.tileLayer.wms(wmsUrl, {
      layers: 'RAS_Radar_Nexrad_Reflectivity',
      format: 'image/png',
      transparent: true,
      version: '1.3.0',
      crs: L.CRS.EPSG3857,
      time: 'latest',
      attribution: 'NOAA NowCOAST',
      pane: 'radarPane',
      maxZoom: 12, // NowCOAST typically doesn't serve street-level tiles; keep lower than map max
      minZoom: 3
    });

    // Add to layer control
    if (window._customLayerControl && typeof window._customLayerControl.addOverlay === "function") {
      window._customLayerControl.addOverlay(nowcoastWms, "NOAA NowCOAST Radar");
    }

    // RainViewer fallback (higher zoom support for visual continuity)
    window.rainViewerLayer = L.tileLayer('https://tilecache.rainviewer.com/v2/radar/256/{z}/{x}/{y}/0/0_0.png', {
      pane: 'radarPane',
      opacity: 0.6,
      attribution: 'RainViewer',
      maxZoom: 16,
      minZoom: 3
    });
    window._customLayerControl.addOverlay(window.rainViewerLayer, "RainViewer Radar");

    // If NowCOAST returns placeholder tiles or errors, fallback to RainViewer automatically
    nowcoastWms.on('tileerror', () => {
      if (!map.hasLayer(window.rainViewerLayer)) window.rainViewerLayer.addTo(map);
      if (map.hasLayer(nowcoastWms)) map.removeLayer(nowcoastWms);
      console.warn('NowCOAST tile error — switched to RainViewer fallback');
    });

    // Add a small control for switching between NOAA and RainViewer and for forcing proxy usage
    const RadarSwitch = L.Control.extend({
      options: { position: 'topleft' },
      onAdd: function () {
        const container = L.DomUtil.create('div', 'radar-switch');
        container.style.background = 'rgba(20,20,20,0.9)';
        container.style.padding = '6px';
        container.style.borderRadius = '6px';
        container.style.color = '#fff';
        container.innerHTML = `
          <div style="font-weight:600; font-size:12px; margin-bottom:6px;">Radar Source</div>
          <button id="useNowBtn" style="display:block;margin-bottom:6px;">Use NOAA</button>
          <button id="useRainBtn" style="display:block;">Use RainViewer</button>
        `;
        L.DomEvent.disableClickPropagation(container);
        return container;
      }
    });
    map.addControl(new RadarSwitch());

    setTimeout(() => {
      const useNowBtn = document.getElementById('useNowBtn');
      const useRainBtn = document.getElementById('useRainBtn');
      if (useNowBtn) useNowBtn.addEventListener('click', () => {
        if (map.hasLayer(window.rainViewerLayer)) map.removeLayer(window.rainViewerLayer);
        if (!map.hasLayer(nowcoastWms)) nowcoastWms.addTo(map);
      });
      if (useRainBtn) useRainBtn.addEventListener('click', () => {
        if (map.hasLayer(nowcoastWms)) map.removeLayer(nowcoastWms);
        if (!map.hasLayer(window.rainViewerLayer)) window.rainViewerLayer.addTo(map);
      });
    }, 120);

    // --- Vertical radar control (opacity + show/hide) ---
    const RadarVerticalControl = L.Control.extend({
      options: { position: 'topleft' },
      onAdd: function () {
        const container = L.DomUtil.create('div', 'radar-vertical-container');
        container.style.pointerEvents = 'auto';
        const inner = document.createElement('div');
        inner.className = 'radar-vertical';
        inner.innerHTML = `
          <div style="font-weight:600; font-size:13px;">Radar</div>
          <input id="radarOpacityV" type="range" min="0" max="100" value="${Math.round((window.rainViewerLayer.options.opacity||0.6)*100)}" />
          <button id="radarToggleV">Show</button>
          <button id="radarRefreshV" title="Force refresh">⟳</button>
          <div id="radarStatus" style="font-size:11px;color:#ffd; margin-top:6px; text-align:center;"></div>
        `;
        container.appendChild(inner);
        L.DomEvent.disableClickPropagation(container);
        L.DomEvent.disableScrollPropagation(container);
        return container;
      }
    });
    map.addControl(new RadarVerticalControl());

    setTimeout(() => {
      const slider = document.getElementById('radarOpacityV');
      const toggleBtn = document.getElementById('radarToggleV');
      const refreshBtn = document.getElementById('radarRefreshV');
      const statusEl = document.getElementById('radarStatus');

      if (slider) {
        const initialOpacity = (window.rainViewerLayer && window.rainViewerLayer.options && window.rainViewerLayer.options.opacity) ? window.rainViewerLayer.options.opacity : 0.6;
        slider.value = Math.round(initialOpacity * 100);
        slider.addEventListener('input', (e) => {
          const v = Number(e.target.value) / 100;
          if (window.rainViewerLayer) window.rainViewerLayer.setOpacity(v);
          if (nowcoastWms && map.hasLayer(nowcoastWms)) nowcoastWms.setParams({ opacity: v }, false);
        });
      }

      let radarVisible = false;
      toggleBtn.addEventListener('click', (e) => {
        if (radarVisible) {
          if (window.rainViewerLayer && map.hasLayer(window.rainViewerLayer)) map.removeLayer(window.rainViewerLayer);
          if (nowcoastWms && map.hasLayer(nowcoastWms)) map.removeLayer(nowcoastWms);
          toggleBtn.textContent = 'Show';
          radarVisible = false;
          stopRadarAutoRefresh();
          statusEl.textContent = '';
        } else {
          // prefer NOAA if available, otherwise RainViewer
          if (!map.hasLayer(nowcoastWms) && !map.hasLayer(window.rainViewerLayer)) {
            // try NOAA first
            nowcoastWms.addTo(map);
            // if NOAA tile errors, it will fallback to RainViewer via tileerror handler
          }
          toggleBtn.textContent = 'Hide';
          radarVisible = true;
          startRadarAutoRefresh();
          statusEl.textContent = 'Live';
        }
      });

      refreshBtn.addEventListener('click', (e) => {
        const baseRV = 'https://tilecache.rainviewer.com/v2/radar/256/{z}/{x}/{y}/0/0_0.png';
        if (window.rainViewerLayer) window.rainViewerLayer.setUrl(baseRV + '?_cb=' + Date.now());
        if (nowcoastWms) {
          // force WMS cache-buster by toggling a param
          nowcoastWms.setParams({ _cb: Date.now() }, false);
        }
        statusEl.textContent = 'Refreshing…';
        setTimeout(()=> statusEl.textContent = 'Live', 800);
      });
    }, 120);

    setTimeout(()=> map.invalidateSize(), 300);

    /* ---------- Robust marker creation with zoom-based scaling ---------- */
    (function createMarkersFromStores(){
      try {
        if (!Array.isArray(stores)) { console.warn("No stores array found."); return; }
        if (!storeLayer) { console.warn("storeLayer missing."); return; }

        markers = {};
        storeLayer.clearLayers();

        let firstLatLng = null;
        let created = 0;

        // helper: parse and normalize lat/lon
        function parseCoords(rawLat, rawLon) {
          const clean = v => (typeof v === 'string') ? v.replace(/,/g,'').trim() : v;
          let lat = parseFloat(clean(rawLat));
          let lon = parseFloat(clean(rawLon));
          if (!isFinite(lat) || !isFinite(lon)) return null;

          // detect swapped coords (lat outside -90..90 or lon outside -180..180)
          if (lat < -90 || lat > 90 || lon < -180 || lon > 180) {
            // try swapping
            if (lon >= -90 && lon <= 90 && lat >= -180 && lat <= 180) {
              const tmp = lat; lat = lon; lon = tmp;
            } else {
              return null;
            }
          }
          return { lat, lon };
        }

        // base icon sizes (will be scaled by zoom)
        const BASE_ICON = { width: 25, height: 41 };

        // create icon factory that returns an L.icon sized for current zoom
        function makeIcon(color, zoom) {
          const MIN_Z = map.getMinZoom ? map.getMinZoom() : 3;
          const MAX_Z = Math.min(map.getMaxZoom ? map.getMaxZoom() : 19, 19);
          const z = Math.max(MIN_Z, Math.min(MAX_Z, zoom));
          const t = (z - MIN_Z) / Math.max(1, (MAX_Z - MIN_Z));
          const scale = 0.4 + 0.6 * t; // 0.4..1.0 for wider dynamic range
          const w = Math.max(8, Math.round(BASE_ICON.width * scale));
          const h = Math.max(12, Math.round(BASE_ICON.height * scale));
          const url = (color === 'red') ? "https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-red.png"
                    : (color === 'yellow') ? "https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-yellow.png"
                    : "https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-grey.png";
          return L.icon({
            iconUrl: url,
            shadowUrl: "https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png",
            iconSize: [w, h],
            iconAnchor: [Math.round(w/2), h],
            popupAnchor: [1, -Math.round(h*0.8)]
          });
        }

        // create markers
        stores.forEach((store, idx) => {
          const latRaw = store.Latitude ?? store.lat ?? store.Lat ?? store.outageLat;
          const lonRaw = store.Longitude ?? store.lon ?? store.Long ?? store.outageLon;
          const coords = parseCoords(latRaw, lonRaw);
          if (!coords) {
            console.warn(`Skipping store index ${idx} (invalid coords)`, store["Site #"] || store.SiteName || store);
            return;
          }
          const lat = coords.lat, lon = coords.lon;

          const color = store.color === 'red' ? 'red' : (store.color === 'yellow' ? 'yellow' : 'gray');
          const icon = makeIcon(color, map.getZoom());

          const marker = L.marker([lat, lon], { icon, pane: (storeLayer.options && storeLayer.options.pane) ? storeLayer.options.pane : undefined });

          const popupHtml = `
            <b>Store ${store["Site #"] || ""} – ${store.SiteName || ""}</b><br>
            ${store.Location || "N/A"}<br>
            ${store.City || ""}, ${store.State || ""}<br>
            <b>Status:</b> ${store.status || "No outage"}<br>
            <b>ETA:</b> ${store.etr || "N/A"}<br>
            <b>Last Updated:</b> ${store.lastUpdated || "N/A"}<br>
            ${store.providerWebsite ? `<br><a href="${store.providerWebsite}" target="_blank">Outage Map</a>` : ""}
          `;
          marker.bindPopup(popupHtml);
          marker.addTo(storeLayer);

          const key = String(store["Site #"] || `${store.SiteName || "store"}_${created}`);
          markers[key] = { marker, store };

          if (!firstLatLng) firstLatLng = [lat, lon];
          created++;
        });

        console.log(`Markers created: ${created}`);
        if (created && firstLatLng && window.map) {
          // keep default view as whole USA; do not auto-zoom to first marker
        } else if (!created) {
          console.warn("No markers created. Check Sites.csv parsing and Latitude/Longitude fields.");
        }

        // Zoom handler: update icon sizes dynamically
        function updateMarkerIconsOnZoom() {
          const z = map.getZoom();
          Object.values(markers).forEach(entry => {
            const store = entry.store;
            const color = store.color === 'red' ? 'red' : (store.color === 'yellow' ? 'yellow' : 'gray');
            const newIcon = makeIcon(color, z);
            try { entry.marker.setIcon(newIcon); } catch(e) {}
          });
        }

        // Attach zoomend once (avoid duplicate handlers)
        map.off('zoomend', updateMarkerIconsOnZoom);
        map.on('zoomend', updateMarkerIconsOnZoom);

        // initial sizing
        updateMarkerIconsOnZoom();

      } catch (err) {
        console.error("createMarkersFromStores error:", err);
      }
    })();
  }

  /* ---------- Collapse handler (fixed) ---------- */
  (function wireCollapse(){
    const toggle = document.getElementById("toggleBtn");
    const bubble = document.getElementById("collapseBubble");
    const sidebarEl = document.getElementById("sidebar");
    const mapEl = document.getElementById("map");
    if(!sidebarEl || !mapEl) return;

    function setCollapsed(collapsed){
      if(collapsed){
        document.body.classList.add("sidebar-collapsed");
        sidebarEl.setAttribute("aria-hidden","true");
        if(bubble) bubble.style.display = "flex";
        if(toggle){ toggle.setAttribute("aria-expanded","false"); toggle.innerText = "◂"; }
        mapEl.style.right = "0";
      } else {
        document.body.classList.remove("sidebar-collapsed");
        sidebarEl.setAttribute("aria-hidden","false");
        if(bubble) bubble.style.display = "none";
        if(toggle){ toggle.setAttribute("aria-expanded","true"); toggle.innerText = "▸"; }
        mapEl.style.right = sidebarEl.offsetWidth + "px";
      }
      setTimeout(() => { if(window.map && typeof window.map.invalidateSize === "function") window.map.invalidateSize(); }, 260);
    }

    setCollapsed(document.body.classList.contains("sidebar-collapsed"));

    if(toggle){
      toggle.addEventListener("click", (ev) => {
        ev.stopPropagation();
        const collapsed = !document.body.classList.contains("sidebar-collapsed");
        setCollapsed(collapsed);
      });
    }

    if(bubble){
      bubble.addEventListener("click", (ev) => {
        ev.stopPropagation();
        setCollapsed(false);
      });
    }

    window.addEventListener('resize', () => {
      if (!document.body.classList.contains("sidebar-collapsed")) {
        mapEl.style.right = sidebarEl.offsetWidth + "px";
        if(window.map && typeof window.map.invalidateSize === "function") window.map.invalidateSize();
      }
    });
  })();

  /* ---------- Update outage status for a store (icon, popup, bring-to-front, pulse) ---------- */
  function updateOutageStatusForStore(storeNumber, newStatusObj) {
    const key = String(storeNumber);
    const entry = markers[key];
    if (!entry) return;
    const marker = entry.marker;
    const store = entry.store;

    store.color = newStatusObj.color || store.color || 'white';
    store.status = newStatusObj.status || store.status;
    store.etr = newStatusObj.etr || store.etr;
    store.lastUpdated = newStatusObj.lastUpdated || store.lastUpdated;

    // compute size for current zoom
    const MIN_Z = map.getMinZoom ? map.getMinZoom() : 3;
    const MAX_Z = Math.min(map.getMaxZoom ? map.getMaxZoom() : 19, 19);
    const z = map.getZoom();
    const t = (z - MIN_Z) / Math.max(1, (MAX_Z - MIN_Z));
    const scale = 0.4 + 0.6 * t;
    const w = Math.max(8, Math.round(25 * scale));
    const h = Math.max(12, Math.round(41 * scale));

    const iconUrl = (store.color === "red")
      ? "https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-red.png"
      : (store.color === "yellow")
        ? "https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-yellow.png"
        : "https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-grey.png";

    const newIcon = L.icon({
      iconUrl,
      shadowUrl: "https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png",
      iconSize: [w, h],
      iconAnchor: [Math.round(w/2), h],
      popupAnchor: [1, -Math.round(h*0.8)]
    });
    marker.setIcon(newIcon);

    if (store.color === 'red' || store.color === 'yellow') {
      try {
        marker.setZIndexOffset(1000);
        if (marker.bringToFront) marker.bringToFront();
        const el = marker._icon;
        if (el) el.classList.add('pulse');
      } catch(e){}
    } else {
      try {
        marker.setZIndexOffset(0);
        const el = marker._icon;
        if (el) el.classList.remove('pulse');
      } catch(e){}
    }

    const popupHtml = `
      <b>Store ${store["Site #"] || ""} – ${store.SiteName || ""}</b><br>
      ${store.Location || "N/A"}<br>
      ${store.City || ""}, ${store.State || ""}<br>
      <b>Status:</b> ${store.status || "No outage"}<br>
      <b>ETA:</b> ${store.etr || "N/A"}<br>
      <b>Last Updated:</b> ${store.lastUpdated || "N/A"}<br>
      ${store.providerWebsite ? `<br><a href="${store.providerWebsite}" target="_blank">Outage Map</a>` : ""}
    `;
    marker.getPopup() && marker.setPopupContent(popupHtml);
  }

  /* ---------- UI wiring ---------- */
  (function wireUI(){
    const filter = document.getElementById("filterSelect");
    const search = document.getElementById("searchBar");
    const dashHandle = document.getElementById("dashboardHandle");
    const bottom = document.getElementById("bottomDashboard");
    const resetStateBtn = document.getElementById("resetStateBtn");

    if(search){
      search.addEventListener("input", e => {
        const q = (e.target.value || "").trim().toLowerCase();
        if(!q) { renderStoreList(); return; }
        const found = stores.find(s => String(s["Site #"]).toLowerCase() === q);
        if(found && markers[String(found["Site #"])]) {
          const m = markers[String(found["Site #"])].marker;
          map.setView(m.getLatLng(), 16);
          m.openPopup();
        } else renderStoreList(q);
      });
    }

    if(filter) filter.addEventListener("change", ()=> renderStoreList((search && search.value) ? search.value.toLowerCase() : ""));

    if(dashHandle && bottom) dashHandle.addEventListener("click", ()=> {
      bottom.classList.toggle("expanded");
      if(bottom.classList.contains("expanded")) renderDashboard(stores);
    });

    if (resetStateBtn) {
      resetStateBtn.onclick = (ev) => {
        ev.preventDefault();
        ev.stopPropagation();
        try {
          // Reset to whole USA view (default)
          if (window.map) window.map.setView([39.0, -98.0], 4);
          renderStoreList();
          renderDashboard(stores);
          setTimeout(() => { if (window.map && typeof window.map.invalidateSize === "function") window.map.invalidateSize(); }, 120);
        } catch (e) {
          console.error("resetStateBtn click handler error:", e);
        }
      };
    }
  })();

  /* ---------- Radar auto-refresh helpers ---------- */
  let radarRefreshTimer = null;
  function startRadarAutoRefresh(intervalMs = 30_000) {
    if (radarRefreshTimer) clearInterval(radarRefreshTimer);
    radarRefreshTimer = setInterval(() => {
      if (window.rainViewerLayer && map.hasLayer(window.rainViewerLayer)) {
        const base = 'https://tilecache.rainviewer.com/v2/radar/256/{z}/{x}/{y}/0/0_0.png';
        window.rainViewerLayer.setUrl(base + '?_cb=' + Date.now());
      }
      // also nudge WMS cache if present
      try { if (map && map.eachLayer) { /* noop */ } } catch(e){}
    }, intervalMs);
  }
  function stopRadarAutoRefresh() {
    if (radarRefreshTimer) { clearInterval(radarRefreshTimer); radarRefreshTimer = null; }
  }

  /* ---------- Diagnostic helper (console) ---------- */
  function diagnosticLog() {
    console.log("rainViewerLayer exists:", !!window.rainViewerLayer, "map.hasLayer:", !!window.rainViewerLayer && map.hasLayer(window.rainViewerLayer));
    if (window.rainViewerLayer) console.log("rainViewerLayer._url:", window.rainViewerLayer._url || "(no _url)");
    console.log("Markers count:", Object.keys(markers).length);
  }

  /* ---------- Load data and start ---------- */
  Promise.all([
    fetch("Sites.csv").then(r => r.text()).catch(()=> ""),
    fetch("outages.json").then(r => r.json()).catch(()=> [])
  ]).then(([csvText, outages])=>{
    stores = csvText ? parseCSV(csvText) : [];
    if(!Array.isArray(outages)) outages = [];

    stores.forEach(s => { s["Site #"] = s["Site #"] || s.Site || s.site || ""; });

    (stores || []).forEach(store => {
      const match = (outages || []).find(o => String(o.storeNumber) === String(store["Site #"]));
      if(match){
        store.color = match.color || "white";
        store.status = match.status || "Unknown";
        store.etr = match.etr || "";
        store.lastUpdated = match.lastUpdated || "";
        store.providerWebsite = match.providerWebsite || store["Vendor Link"] || "";
      } else {
        store.color = "white";
        store.status = "No outage";
        store.providerWebsite = store["Vendor Link"] || "";
      }
    });

    try { safeSetItem(SNAPSHOT_KEY, JSON.stringify([{ ts: Date.now(), count: stores.filter(s=>s.color!=="white").length }])); } catch(e){}

    initMapAndLayers();
    renderStoreList();
    renderDashboard(stores);

    // After map and markers exist, update markers to reflect initial outage colors and bring to front if needed
    setTimeout(() => {
      stores.forEach(s => {
        if (s["Site #"]) {
          updateOutageStatusForStore(s["Site #"], { color: s.color, status: s.status, etr: s.etr, lastUpdated: s.lastUpdated });
        }
      });
      diagnosticLog();
    }, 600);
  }).catch(err=>{
    console.error("Load failed", err);
    alert("Failed to load Sites.csv or outages.json");
  });

  </script>

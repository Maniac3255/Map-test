<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Store Outage Map</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            display: flex;
        }

        #map {
            flex: 1;
            height: 100vh;
        }

        /* Sidebar always visible */
        #sidebar {
            width: 320px;
            background: #f7f7f7;
            border-left: 1px solid #ccc;
            padding: 10px;
            overflow-y: auto;
            height: 100vh;
        }

        #sidebar h2 {
            margin-top: 0;
            text-align: center;
        }

        .store-item {
            padding: 8px;
            margin: 6px 0;
            background: white;
            border-radius: 6px;
            cursor: pointer;
            border: 1px solid #ddd;
        }

        .store-item:hover {
            background: #e9f3ff;
        }

        .legend {
            background: white;
            padding: 10px;
            line-height: 1.5;
            border-radius: 6px;
            box-shadow: 0 0 5px rgba(0,0,0,0.3);
        }
        .legend div {
            display: flex;
            align-items: center;
        }
        .legend span {
            height: 12px;
            width: 12px;
            margin-right: 6px;
            display: inline-block;
        }
    </style>
</head>

<body>

<div id="map"></div>

<div id="sidebar">
    <h2>All Stores</h2>
    <div id="storeList">

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Store Outage Map</title>

    <!-- Leaflet CSS -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        #map {
            height: 100vh;
            width: 100vw;
        }
        .legend {
            background: white;
            padding: 10px;
            line-height: 1.5;
            border-radius: 6px;
            box-shadow: 0 0 5px rgba(0,0,0,0.3);
        }
        .legend div {
            display: flex;
            align-items: center;
        }
        .legend span {
            height: 12px;
            width: 12px;
            margin-right: 6px;
            display: inline-block;
        }
    </style>
</head>

<body>

<div id="map"></div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
// ==========================================
// LOAD OUTAGE DATA
// ==========================================

fetch("outages.json")
    .then(response => response.json())
    .then(data => initMap(data))
    .catch(err => console.error("Error loading outages.json:", err));

// ==========================================
// INITIALIZE MAP
// ==========================================

function initMap(outages) {

    // Default center (USA)
    let map = L.map("map").setView([37.5, -95.5], 5);

    // Base map layer
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 18,
        attribution: "© OpenStreetMap"
    }).addTo(map);

    // Color mapping
    const colorMap = {
        red: "red",
        yellow: "orange",
        white: "blue"
    };

    // Add markers
    outages.forEach(store => {

        let color = colorMap[store.color] || "blue";

        let marker = L.circleMarker([store.lat, store.lon], {
            radius: 10,
            color: color,
            fillColor: color,
            fillOpacity: 0.8
        });

        let popupHtml = `
            <b>Store ${store.storeNumber} – ${store.storeName}</b><br>
            ${store.address}<br><br>

            <b>Distance:</b> ${store.distanceMiles} miles<br>
            <b>Status:</b> ${store.status}<br>
            <b>Planned:</b> ${store.plannedOutage}<br>
            <b>ETA:</b> ${store.etr}<br>
            <b>Last Updated:</b> ${store.lastUpdated}<br><br>

            <b>Store Location:</b> ${store.lat}, ${store.lon}<br>
            <b>Outage Location:</b> ${store.outageLat}, ${store.outageLon}<br>
        `;

        marker.bindPopup(popupHtml);
        marker.addTo(map);
    });

    // ==========================================
    // LEGEND
    // ==========================================

    let legend = L.control({ position: "bottomright" });

    legend.onAdd = function () {
        let div = L.DomUtil.create("div", "legend");

        div.innerHTML = `
            <div><span style="background:red"></span> Outage Detected (0–0.5 miles)</div>
            <div><span style="background:orange"></span> Possible Outage (0.5–1 mile)</div>
            <div><span style="background:blue"></span> Store Impacted (>1 mile)</div>
        `;

        return div;
    };

    legend.addTo(map);
}
</script>

</body>
</html>

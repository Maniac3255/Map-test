/* ------------------------------
   ERROR + NOTIFICATION HANDLING
--------------------------------*/
function showError(message) {
    alert(message);

function showUpdateNotification() {
    alert("Map data updated. Reloading...");
    location.reload();

/* ------------------------------
   SNAPSHOT STORAGE
--------------------------------*/
const SNAPSHOT_KEY = 'outageSnapshots_v1';
const SNAPSHOT_WINDOW_MS = 48 * 60 * 60 * 1000;

function loadSnapshots() {
    try {
        const raw = localStorage.getItem(SNAPSHOT_KEY);
        return raw ? JSON.parse(raw) : [];
    } catch {
        return [];
    }
}

function saveSnapshots(arr) {
    localStorage.setItem(SNAPSHOT_KEY, JSON.stringify(arr));
}

function saveSnapshot(count) {
    const snaps = loadSnapshots();
    const now = Date.now();
    snaps.push({ ts: now, count });
    const cutoff = now - SNAPSHOT_WINDOW_MS;
    saveSnapshots(snaps.filter(s => s.ts >= cutoff));
}

/* ------------------------------
   CSV PARSER
--------------------------------*/
function parseCSV(text) {
    const lines = text.trim().split("\n");
    const headers = lines[0].split(",").map(h => h.trim());

    return lines.slice(1).map(line => {
        const cols = line.split(",");
        let obj = {};
        headers.forEach((h, i) => obj[h] = cols[i]?.trim() || "");

        obj.Latitude = parseFloat(obj.Latitude) || NaN;
        obj.Longitude = parseFloat(obj.Longitude) || NaN;

        return obj;
    });
}

function mergeOutageData(stores, outages) {
    stores.forEach(store => {
        const match = outages.find(o => o.storeNumber == store["Site #"]);

        if (match) {
            store.color = match.color || "white";
            store.status = match.status || "Unknown";
            store.distanceMiles = match.distanceMiles || "";
            store.outageLat = match.outageLat || "";
            store.outageLon = match.outageLon || "";
            store.etr = match.etr || "";
            store.lastUpdated = match.lastUpdated || "";
            store.providerWebsite = match.providerWebsite || "";
        } else {
            store.color = "white";
            store.status = "No outage";
            store.providerWebsite = store["Vendor Link"] || "";
        }
    });
}

    let lastHash = null;

    async function checkForUpdate() {
        try {
            const response = await fetch("outages.json", { cache: "no-store" });
            const text = await response.text();
            const hash = btoa(text);

            if (lastHash && lastHash !== hash) {
                const currentOutages = stores.filter(s => s.color !== "white").length;
                saveSnapshot(currentOutages);
                showUpdateNotification();
            }

            lastHash = hash;

    }

const storeListDiv = document.getElementById("storeList");

function renderStoreList(filterText = "") {
    storeListDiv.innerHTML = "";

    const filtered = stores.filter(s => {
        if (filterSelect.value === "outages" && s.color === "white") return false;

        const siteNum = String(s["Site #"]).toLowerCase();
        const siteName = String(s.SiteName || "").toLowerCase();
        const city = String(s.City || "").toLowerCase();

        return (
            siteNum.includes(filterText) ||
            siteName.includes(filterText) ||
            city.includes(filterText)
        );
    });

    filtered.forEach(store => {
        let div = document.createElement("div");
        div.className = "store-item";

        div.innerHTML = `
            <b>${store["Site #"]} – ${store.SiteName}</b><br>
            <b>Address:</b> ${store.Location || "N/A"}<br>
            ${store.City}, ${store.State}<br>
            <span style="color:${store.color}">● ${store.color.toUpperCase()}</span><br>
            ${store.providerWebsite ? `<a href="${store.providerWebsite}" target="_blank" style="color:#9ec9ff;">Outage Map</a>` : ""}
        `;

        div.onclick = () => {
            let marker = markers[store["Site #"]];
            if (marker) {
                map.setView(marker.getLatLng(), 14);
                marker.openPopup();
            }
        };

        storeListDiv.appendChild(div);
    });
}

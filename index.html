<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Power Outage Demo</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
html, body {
    margin: 0;
    padding: 0;
}

#map {
    height: 100vh;
    width: 100%;
}
</style>
</head>

<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

// Initialize map
const map = L.map('map').setView([34.0, -118.0], 7);

// OpenStreetMap tiles
L.tileLayer(
    'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
        maxZoom: 19
    }
).addTo(map);

// --------------------
// OUTAGE LOCATION
// --------------------

const outageLat = 34.274;
const outageLon = -119.229;

// Red outage marker
L.marker(
    [outageLat, outageLon]
)
.addTo(map)
.bindPopup(
    "<b>SCE Outage</b><br>Active outage location"
);

// Yellow impact radius
L.circle(
    [outageLat, outageLon],
    {
        color: 'yellow',
        fillColor: 'yellow',
        fillOpacity: 0.25,
        radius: 1609
    }
)
.addTo(map);

// --------------------
// STORE LOCATION
// --------------------

L.circleMarker(
    [34.280, -119.220],
    {
        color: 'green',
        fillColor: 'green',
        fillOpacity: 1,
        radius: 8
    }
)
.addTo(map)
.bindPopup(
    "<b>Store 12345</b><br>Impacted Location"
);

</script>

</body>
</html>

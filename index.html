<script>
/* ------------------------------
   ERROR + NOTIFICATION HANDLING
--------------------------------*/
function showError(message) { alert(message); }
function showUpdateNotification() { alert("Map data updated. Reloading..."); location.reload(); }

/* ------------------------------
   SNAPSHOT STORAGE
--------------------------------*/
const SNAPSHOT_KEY = 'outageSnapshots_v1';
const SNAPSHOT_WINDOW_MS = 48 * 60 * 60 * 1000;

function loadSnapshots() {
    try { return JSON.parse(localStorage.getItem(SNAPSHOT_KEY)) || []; }
    catch { return []; }
}

function saveSnapshots(arr) { localStorage.setItem(SNAPSHOT_KEY, JSON.stringify(arr)); }

function saveSnapshot(count) {
    const snaps = loadSnapshots();
    const now = Date.now();
    snaps.push({ ts: now, count });
    saveSnapshots(snaps.filter(s => s.ts >= now - SNAPSHOT_WINDOW_MS));
}

/* ------------------------------
   CSV PARSER
--------------------------------*/
function parseCSV(text) {
    const lines = text.trim().split("\n");
    const headers = lines[0].split(",").map(h => h.trim());
    return lines.slice(1).map(line => {
        const cols = line.split(",");
        let obj = {};
        headers.forEach((h, i) => obj[h] = cols[i]?.trim() || "");
        obj.Latitude = parseFloat(obj.Latitude) || NaN;
        obj.Longitude = parseFloat(obj.Longitude) || NaN;
        return obj;
    });
}

/* ------------------------------
   OUTAGE MERGE
--------------------------------*/
function mergeOutageData(stores, outages) {
    stores.forEach(store => {
        const match = outages.find(o => o.storeNumber == store["Site #"]);
        if (match) {
            store.color = match.color || "white";
            store.status = match.status || "Unknown";
            store.distanceMiles = match.distanceMiles || "";
            store.outageLat = match.outageLat || "";
            store.outageLon = match.outageLon || "";
            store.etr = match.etr || "";
            store.lastUpdated = match.lastUpdated || "";
            store.providerWebsite = match.providerWebsite || "";
        } else {
            store.color = "white";
            store.status = "No outage";
            store.providerWebsite = store["Vendor Link"] || "";
        }
    });
}

   GLOBALS
--------------------------------*/

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Operations Outage Map</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <style>
    :root {
      --bg: #07111f;
      --panel: rgba(12, 25, 43, 0.96);
      --panel-2: #10243c;
      --text: #eef6ff;
      --muted: #9fb2c8;
      --border: rgba(255, 255, 255, 0.13);
      --accent: #33a7ff;
      --red: #ef4444;
      --yellow: #facc15;
      --green: #22c55e;
      --shadow: 0 14px 38px rgba(0, 0, 0, 0.32);
      --sidebar-width: 360px;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background: var(--bg);
    }

    button, input, select { font: inherit; }

    #app { position: relative; width: 100%; height: 100%; }
    #map { position: absolute; inset: 0; z-index: 1; }

    .topbar {
      position: absolute;
      z-index: 1000;
      top: 14px;
      left: 54px;
      right: 14px;
      min-height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: rgba(7, 17, 31, 0.9);
      backdrop-filter: blur(14px);
      box-shadow: var(--shadow);
    }

    .brand { display: flex; align-items: center; gap: 10px; min-width: 220px; }
    .brand-mark {
      width: 36px; height: 36px; border-radius: 11px;
      display: grid; place-items: center;
      background: linear-gradient(135deg, #0ea5e9, #2563eb);
      font-weight: 900;
    }
    .brand-title { font-weight: 800; line-height: 1.1; }
    .brand-subtitle { margin-top: 3px; color: var(--muted); font-size: 12px; }

    .controls { display: flex; align-items: center; justify-content: flex-end; flex-wrap: wrap; gap: 8px; }

    .control, .action-button {
      min-height: 38px;
      padding: 8px 11px;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--panel-2);
      outline: none;
    }

    select.control { cursor: pointer; }
    input.control { width: min(260px, 34vw); }
    input.control::placeholder { color: #8296ae; }

    .action-button { cursor: pointer; font-weight: 750; }
    .action-button:hover { border-color: rgba(51, 167, 255, 0.75); }

    .status-strip {
      position: absolute;
      z-index: 900;
      left: 14px;
      bottom: 14px;
      display: flex;
      gap: 8px;
      padding: 8px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: rgba(7, 17, 31, 0.9);
      backdrop-filter: blur(12px);
      box-shadow: var(--shadow);
    }

    .metric {
      min-width: 92px;
      padding: 8px 10px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.05);
    }
    .metric-label { color: var(--muted); font-size: 11px; }
    .metric-value { margin-top: 2px; font-weight: 900; font-size: 20px; }
    .metric.red .metric-value { color: #ff6b6b; }
    .metric.yellow .metric-value { color: #fde047; }
    .metric.green .metric-value { color: #4ade80; }

    .sidebar {
      position: absolute;
      z-index: 1100;
      top: 86px;
      right: 14px;
      bottom: 14px;
      width: min(var(--sidebar-width), calc(100vw - 28px));
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: var(--panel);
      box-shadow: var(--shadow);
      transform: translateX(calc(100% + 30px));
      transition: transform 220ms ease;
    }
    .sidebar.open { transform: translateX(0); }

    .sidebar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 16px;
      border-bottom: 1px solid var(--border);
    }
    .sidebar-title { font-weight: 850; font-size: 18px; }
    .sidebar-count { color: var(--muted); font-size: 12px; margin-top: 3px; }
    .icon-button {
      width: 34px; height: 34px; border: 1px solid var(--border); border-radius: 9px;
      color: var(--text); background: rgba(255,255,255,.06); cursor: pointer;
    }

    #storeList { overflow: auto; padding: 10px; }

    .store-card {
      width: 100%;
      margin-bottom: 8px;
      padding: 12px;
      text-align: left;
      color: var(--text);
      border: 1px solid var(--border);
      border-left: 5px solid var(--status-color, var(--green));
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.045);
      cursor: pointer;
    }
    .store-card:hover { background: rgba(255, 255, 255, 0.085); }
    .store-card-title { font-weight: 800; }
    .store-card-meta { margin-top: 4px; color: var(--muted); font-size: 12px; line-height: 1.35; }
    .store-card-status { margin-top: 8px; font-size: 12px; font-weight: 800; color: var(--status-color); }

    .empty-state { padding: 32px 16px; text-align: center; color: var(--muted); }

    .leaflet-control-zoom a { background: #10243c !important; color: white !important; border-color: var(--border) !important; }
    .leaflet-popup-content-wrapper, .leaflet-popup-tip { background: #0d1d31; color: var(--text); }
    .leaflet-popup-content { min-width: 250px; margin: 14px; }

    .state-circle, .store-marker { background: transparent; border: none; }

    .state-bubble {
      width: var(--size); height: var(--size);
      display: grid; place-items: center;
      border: 3px solid rgba(255,255,255,.95);
      border-radius: 50%;
      background: var(--bubble-color);
      color: white;
      box-shadow: 0 5px 16px rgba(0,0,0,.45);
      font-weight: 900;
      font-size: 12px;
      line-height: 1;
      text-shadow: 0 1px 2px rgba(0,0,0,.75);
    }
    .state-bubble small { display: block; margin-top: 2px; font-size: 9px; opacity: .95; }

    .pin {
      width: 25px; height: 25px;
      display: grid; place-items: center;
      border: 3px solid white;
      border-radius: 50% 50% 50% 0;
      background: var(--pin-color);
      box-shadow: 0 4px 12px rgba(0,0,0,.5);
      transform: rotate(-45deg);
    }
    .pin::after {
      content: "";
      width: 7px; height: 7px;
      border-radius: 50%;
      background: white;
    }
    .pin > span { transform: rotate(45deg); }

    .popup-title { font-size: 16px; font-weight: 900; margin-bottom: 4px; }
    .popup-meta { color: #adc0d5; font-size: 12px; line-height: 1.5; }
    .popup-status { margin: 10px 0; font-weight: 900; }
    .popup-label { display: block; margin: 10px 0 5px; color: #adc0d5; font-size: 11px; }
    .popup-select, .popup-button {
      width: 100%; padding: 8px; border-radius: 8px;
      border: 1px solid rgba(255,255,255,.18); color: white; background: #17304d;
    }
    .popup-button { margin-top: 7px; cursor: pointer; font-weight: 750; }

    .leaflet-tooltip.state-tooltip {
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      background: #0d1d31;
      box-shadow: var(--shadow);
    }

    @media (max-width: 820px) {
      .topbar { left: 12px; right: 12px; align-items: stretch; flex-direction: column; }
      .brand { min-width: 0; }
      .controls { justify-content: stretch; }
      input.control { flex: 1 1 160px; width: auto; }
      .sidebar { top: 150px; }
      .status-strip { right: 12px; overflow-x: auto; }
      .metric { min-width: 80px; }
    }
  </style>
</head>
<body>
<div id="app">
  <div id="map"></div>

  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">O</div>
      <div>
        <div class="brand-title">Operations Outage Map</div>
        <div id="viewLabel" class="brand-subtitle">USA overview</div>
      </div>
    </div>

    <div class="controls">
      <input id="searchBar" class="control" type="search" placeholder="Search site, city, state, provider">
      <select id="filterSelect" class="control" aria-label="Store filter">
        <option value="all">All Stores</option>
        <option value="outages">Outages</option>
      </select>
      <select id="mapStyleSelect" class="control" aria-label="Map style">
        <option value="light">Light Operations</option>
        <option value="dark">Dark Operations</option>
        <option value="street">Standard Street</option>
      </select>
      <button id="storesButton" class="action-button" type="button">Stores</button>
      <button id="usaButton" class="action-button" type="button">USA</button>
    </div>
  </header>

  <aside id="sidebar" class="sidebar" aria-label="Stores panel">
    <div class="sidebar-header">
      <div>
        <div class="sidebar-title">Stores</div>
        <div id="sidebarCount" class="sidebar-count">0 locations</div>
      </div>
      <button id="closeSidebar" class="icon-button" type="button" aria-label="Close stores panel">X</button>
    </div>
    <div id="storeList"></div>
  </aside>

  <div class="status-strip">
    <div class="metric red"><div class="metric-label">Outage</div><div id="redCount" class="metric-value">0</div></div>
    <div class="metric yellow"><div class="metric-label">Possible</div><div id="yellowCount" class="metric-value">0</div></div>
    <div class="metric green"><div class="metric-label">No outage</div><div id="greenCount" class="metric-value">0</div></div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script>
"use strict";

const CONFIG = {
  sitesUrl: "data/Sites.csv",
  outagesUrl: "outages.json",
  usaDisplayBounds: [[24.2, -125.2], [49.7, -66.4]],
  sidebarPadding: 390,
  manualStorageKey: "operations-outage-map-manual-status-v4",
  mapStyleStorageKey: "operations-outage-map-style-v2"
};

const STATE_NAMES = {
  AL:"Alabama", AK:"Alaska", AZ:"Arizona", AR:"Arkansas", CA:"California", CO:"Colorado",
  CT:"Connecticut", DE:"Delaware", FL:"Florida", GA:"Georgia", HI:"Hawaii", ID:"Idaho",
  IL:"Illinois", IN:"Indiana", IA:"Iowa", KS:"Kansas", KY:"Kentucky", LA:"Louisiana",
  ME:"Maine", MD:"Maryland", MA:"Massachusetts", MI:"Michigan", MN:"Minnesota",
  MS:"Mississippi", MO:"Missouri", MT:"Montana", NE:"Nebraska", NV:"Nevada",
  NH:"New Hampshire", NJ:"New Jersey", NM:"New Mexico", NY:"New York",
  NC:"North Carolina", ND:"North Dakota", OH:"Ohio", OK:"Oklahoma", OR:"Oregon",
  PA:"Pennsylvania", RI:"Rhode Island", SC:"South Carolina", SD:"South Dakota",
  TN:"Tennessee", TX:"Texas", UT:"Utah", VT:"Vermont", VA:"Virginia", WA:"Washington",
  WV:"West Virginia", WI:"Wisconsin", WY:"Wyoming", DC:"District of Columbia"
};

const STATE_CENTERS = {
  AL:[32.806671,-86.791130], AK:[61.370716,-152.404419], AZ:[33.729759,-111.431221],
  AR:[34.969704,-92.373123], CA:[36.116203,-119.681564], CO:[39.059811,-105.311104],
  CT:[41.597782,-72.755371], DE:[39.318523,-75.507141], FL:[27.766279,-81.686783],
  GA:[33.040619,-83.643074], HI:[21.094318,-157.498337], ID:[44.240459,-114.478828],
  IL:[40.349457,-88.986137], IN:[39.849426,-86.258278], IA:[42.011539,-93.210526],
  KS:[38.526600,-96.726486], KY:[37.668140,-84.670067], LA:[31.169546,-91.867805],
  ME:[44.693947,-69.381927], MD:[39.063946,-76.802101], MA:[42.230171,-71.530106],
  MI:[43.326618,-84.536095], MN:[45.694454,-93.900192], MS:[32.741646,-89.678696],
  MO:[38.456085,-92.288368], MT:[46.921925,-110.454353], NE:[41.125370,-98.268082],
  NV:[38.313515,-117.055374], NH:[43.452492,-71.563896], NJ:[40.298904,-74.521011],
  NM:[34.840515,-106.248482], NY:[42.165726,-74.948051], NC:[35.630066,-79.806419],
  ND:[47.528912,-99.784012], OH:[40.388783,-82.764915], OK:[35.565342,-96.928917],
  OR:[44.572021,-122.070938], PA:[40.590752,-77.209755], RI:[41.680893,-71.511780],
  SC:[33.856892,-80.945007], SD:[44.299782,-99.438828], TN:[35.747845,-86.692345],
  TX:[31.054487,-97.563461], UT:[40.150032,-111.862434], VT:[44.045876,-72.710686],
  VA:[37.769337,-78.169968], WA:[47.400902,-121.490494], WV:[38.491226,-80.954453],
  WI:[44.268543,-89.616508], WY:[42.755966,-107.302490], DC:[38.9072,-77.0369]
};

const STATUS = {
  RED: { label: "Outage", color: "#ef4444", rank: 0 },
  YELLOW: { label: "Possible Outage", color: "#eab308", rank: 1 },
  GREEN: { label: "No Outage", color: "#22c55e", rank: 2 }
};

const map = L.map("map", { zoomControl: true, minZoom: 3, maxZoom: 18, preferCanvas: true });
const stateLayer = L.layerGroup().addTo(map);
const storeLayer = L.layerGroup().addTo(map);
const tileLayers = {
  light: L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png", { maxZoom: 20, attribution: "&copy; OpenStreetMap &copy; CARTO" }),
  dark: L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", { maxZoom: 20, attribution: "&copy; OpenStreetMap &copy; CARTO" }),
  street: L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "&copy; OpenStreetMap contributors" })
};

let stores = [];
let providerOutages = [];
let providerStatusBySite = new Map();
let markerBySite = new Map();
let selectedState = "";
let activeTileLayer = null;
let manualStatuses = loadManualStatuses();

function clean(value) {
  if (value === null || value === undefined) return "";
  const result = String(value).trim();
  return ["nan", "none", "null", "undefined", "n/a"].includes(result.toLowerCase()) ? "" : result;
}

function firstValue(object, keys) {
  for (const key of keys) {
    const value = clean(object?.[key]);
    if (value !== "") return value;
  }
  return "";
}

function stateCode(value) { return clean(value).toUpperCase(); }

function keyOf(store) {
  const raw = firstValue(store, ["Site #", "Site#", "Site Number", "SiteNumber", "Store #", "Store Number", "siteNumber", "storeNumber", "id"]);
  if (!raw) return "";
  const withoutDecimal = raw.replace(/\.0$/, "");
  return /^\d+$/.test(withoutDecimal) ? withoutDecimal.padStart(4, "0") : withoutDecimal;
}

function siteName(store) {
  return firstValue(store, ["Site Name", "SiteName", "Store Name", "StoreName", "Location Name", "name"]) || `Site ${keyOf(store)}`;
}

function latitudeOf(store) { return Number(firstValue(store, ["Latitude", "latitude", "lat", "LAT"])); }
function longitudeOf(store) { return Number(firstValue(store, ["Longitude", "longitude", "lon", "lng", "LON", "LONG"])); }

function validCoords(latitude, longitude) {
  return Number.isFinite(latitude) && Number.isFinite(longitude) &&
    latitude >= -90 && latitude <= 90 && longitude >= -180 && longitude <= 180 &&
    !(latitude === 0 && longitude === 0);
}

function normalizeStatus(value) {
  const status = clean(value).toUpperCase();
  if (["RED", "OUTAGE", "ACTIVE OUTAGE", "1"].includes(status)) return "RED";
  if (["YELLOW", "POSSIBLE", "POSSIBLE OUTAGE", "WARNING", "2"].includes(status)) return "YELLOW";
  return "GREEN";
}

function loadManualStatuses() {
  try {
    const saved = JSON.parse(localStorage.getItem(CONFIG.manualStorageKey) || "{}");
    return saved && typeof saved === "object" ? saved : {};
  } catch (error) {
    console.warn("Manual status storage could not be read.", error);
    return {};
  }
}

function saveManualStatuses() {
  localStorage.setItem(CONFIG.manualStorageKey, JSON.stringify(manualStatuses));
}

function providerStatus(store) {
  return providerStatusBySite.get(keyOf(store)) || "GREEN";
}

function getAcknowledgement(store) {
  const siteKey = keyOf(store);
  const automatic = providerStatus(store);
  const manual = manualStatuses[siteKey];

  if (manual && manual.providerStatusAtChange !== automatic) {
    delete manualStatuses[siteKey];
    saveManualStatuses();
  }

  const current = manualStatuses[siteKey];
  return {
    status: current?.status || automatic,
    providerStatus: automatic,
    source: current ? "Manual" : "Provider automatic",
    changedAt: current?.changedAt || ""
  };
}

function setManualStatus(siteKey, status) {
  const store = stores.find(item => keyOf(item) === siteKey);
  if (!store) return;

  if (status === "AUTO") {
    delete manualStatuses[siteKey];
  } else {
    manualStatuses[siteKey] = {
      status: normalizeStatus(status),
      providerStatusAtChange: providerStatus(store),
      changedAt: new Date().toISOString()
    };
  }

  saveManualStatuses();
  refreshCurrentView();

  const marker = markerBySite.get(siteKey);
  if (marker) marker.openPopup();
}

window.setManualStatus = setManualStatus;

function statusLabel(store) { return STATUS[getAcknowledgement(store).status].label; }
function statusColor(store) { return STATUS[getAcknowledgement(store).status].color; }

function markerPriority(store) {
  const status = getAcknowledgement(store).status;
  if (status === "RED") return 30000;
  if (status === "YELLOW") return 20000;
  return 1000;
}

function storeIcon(store) {
  return L.divIcon({
    className: "store-marker",
    html: `<div class="pin" style="--pin-color:${statusColor(store)}"><span></span></div>`,
    iconSize: [28, 34], iconAnchor: [14, 31], popupAnchor: [0, -29]
  });
}

function stateIcon(code, items) {
  const counts = countStatuses(items);
  const status = counts.RED > 0 ? "RED" : counts.YELLOW > 0 ? "YELLOW" : "GREEN";
  const impacted = counts.RED + counts.YELLOW;
  const size = Math.max(42, Math.min(68, 40 + Math.sqrt(items.length) * 3));
  return L.divIcon({
    className: "state-circle",
    html: `<div class="state-bubble" style="--size:${size}px;--bubble-color:${STATUS[status].color}"><div>${code}<small>${impacted}</small></div></div>`,
    iconSize: [size, size], iconAnchor: [size / 2, size / 2]
  });
}

function addressOf(store) {
  return [
    firstValue(store, ["Location", "Address", "Street", "Address 1"]),
    firstValue(store, ["City"]),
    stateCode(store.State),
    firstValue(store, ["ZIP", "Zip", "Zip Code", "Postal Code"])
  ].filter(Boolean).join(", ");
}

function escapeHtml(value) {
  return clean(value).replace(/[&<>'"]/g, chr => ({"&":"&amp;", "<":"&lt;", ">":"&gt;", "'":"&#39;", '"':"&quot;"}[chr]));
}

function popupHTML(store) {
  const acknowledgement = getAcknowledgement(store);
  const siteKey = keyOf(store);
  const provider = firstValue(store, ["Vendor Name", "Vendor", "Provider", "Utility"]);
  const changedText = acknowledgement.changedAt ? new Date(acknowledgement.changedAt).toLocaleString() : "";

  return `
    <div class="popup-title">${escapeHtml(siteName(store))}</div>
    <div class="popup-meta">
      Site ${escapeHtml(siteKey)}<br>
      ${escapeHtml(addressOf(store))}<br>
      ${provider ? `Provider: ${escapeHtml(provider)}<br>` : ""}
      Source: ${escapeHtml(acknowledgement.source)}<br>
      Provider status: ${escapeHtml(STATUS[acknowledgement.providerStatus].label)}
      ${changedText ? `<br>Manual change: ${escapeHtml(changedText)}` : ""}
    </div>
    <div class="popup-status" style="color:${STATUS[acknowledgement.status].color}">${escapeHtml(STATUS[acknowledgement.status].label)}</div>
    <label class="popup-label" for="manual-${escapeHtml(siteKey)}">Manual status</label>
    <select id="manual-${escapeHtml(siteKey)}" class="popup-select" onchange="setManualStatus('${escapeHtml(siteKey)}', this.value)">
      <option value="AUTO" ${acknowledgement.source !== "Manual" ? "selected" : ""}>Use provider automatic</option>
      <option value="RED" ${acknowledgement.source === "Manual" && acknowledgement.status === "RED" ? "selected" : ""}>Outage</option>
      <option value="YELLOW" ${acknowledgement.source === "Manual" && acknowledgement.status === "YELLOW" ? "selected" : ""}>Possible Outage</option>
      <option value="GREEN" ${acknowledgement.source === "Manual" && acknowledgement.status === "GREEN" ? "selected" : ""}>No Outage</option>
    </select>
    <button class="popup-button" type="button" onclick="setManualStatus('${escapeHtml(siteKey)}','AUTO')">Return to provider status</button>
  `;
}

function countStatuses(items) {
  const counts = { RED: 0, YELLOW: 0, GREEN: 0 };
  items.forEach(store => counts[getAcknowledgement(store).status]++);
  return counts;
}

function updateMetrics() {
  const counts = countStatuses(stores);
  document.getElementById("redCount").textContent = counts.RED;
  document.getElementById("yellowCount").textContent = counts.YELLOW;
  document.getElementById("greenCount").textContent = counts.GREEN;
}

function setSidebar(closed) {
  document.getElementById("sidebar").classList.toggle("open", !closed);
  window.setTimeout(() => map.invalidateSize({ animate: false }), 230);
}

function sortedStores(items) {
  return [...items].sort((a, b) => {
    const rankDifference = STATUS[getAcknowledgement(a).status].rank - STATUS[getAcknowledgement(b).status].rank;
    if (rankDifference !== 0) return rankDifference;
    return keyOf(a).localeCompare(keyOf(b), undefined, { numeric: true });
  });
}

function filteredStores() {
  const filter = document.getElementById("filterSelect").value;
  const query = document.getElementById("searchBar").value.trim().toLowerCase();

  return stores.filter(store => {
    const status = getAcknowledgement(store).status;
    const statusMatch = filter === "all" || (filter === "outages" && ["RED", "YELLOW"].includes(status));

    // Outages is intentionally nationwide. All Stores respects the selected state.
    const stateMatch = filter === "outages" || !selectedState || stateCode(store.State) === selectedState;

    const searchable = [keyOf(store), siteName(store), addressOf(store), stateCode(store.State),
      firstValue(store, ["Vendor Name", "Vendor", "Provider", "Utility"]), STATUS[status].label]
      .join(" ").toLowerCase();

    return statusMatch && stateMatch && (!query || searchable.includes(query));
  });
}

function renderStoreList() {
  const items = sortedStores(filteredStores());
  const list = document.getElementById("storeList");
  document.getElementById("sidebarCount").textContent = `${items.length} location${items.length === 1 ? "" : "s"}`;

  if (!items.length) {
    list.innerHTML = `<div class="empty-state">No stores match the current view.</div>`;
    return;
  }

  list.innerHTML = items.map(store => `
    <button class="store-card" type="button" style="--status-color:${statusColor(store)}" data-site="${escapeHtml(keyOf(store))}">
      <div class="store-card-title">${escapeHtml(siteName(store))}</div>
      <div class="store-card-meta">Site ${escapeHtml(keyOf(store))}<br>${escapeHtml(addressOf(store))}</div>
      <div class="store-card-status">${escapeHtml(statusLabel(store))}</div>
    </button>
  `).join("");

  list.querySelectorAll(".store-card").forEach(card => {
    card.addEventListener("click", () => focusStore(card.dataset.site));
  });
}

function focusStore(siteKey) {
  const store = stores.find(item => keyOf(item) === siteKey);
  if (!store) return;
  const latitude = latitudeOf(store);
  const longitude = longitudeOf(store);
  if (!validCoords(latitude, longitude)) return;

  let marker = markerBySite.get(siteKey);
  if (!marker) {
    renderStoreMarkers([store], false);
    marker = markerBySite.get(siteKey);
  }

  map.setView([latitude, longitude], Math.max(map.getZoom(), 11), { animate: true });
  marker?.setZIndexOffset(60000);
  marker?.openPopup();
}

function makeStoreMarker(store) {
  const latitude = latitudeOf(store);
  const longitude = longitudeOf(store);
  if (!validCoords(latitude, longitude)) return null;

  const marker = L.marker([latitude, longitude], {
    icon: storeIcon(store),
    zIndexOffset: markerPriority(store),
    riseOnHover: true,
    riseOffset: 50000
  });

  marker.bindPopup(() => popupHTML(store), { maxWidth: 360, autoPan: true, keepInView: true });
  markerBySite.set(keyOf(store), marker);
  return marker;
}

function renderStoreMarkers(items, fitView = true, nationwide = false) {
  if (!map.hasLayer(storeLayer)) storeLayer.addTo(map);
  storeLayer.clearLayers();
  markerBySite.clear();
  const bounds = [];

  sortedStores(items).reverse().forEach(store => {
    const marker = makeStoreMarker(store);
    if (!marker) return;
    marker.addTo(storeLayer);
    bounds.push(marker.getLatLng());
  });

  if (!fitView || !bounds.length) return;

  window.setTimeout(() => {
    map.invalidateSize({ animate: false, pan: false });
    if (bounds.length === 1) {
      map.setView(bounds[0], nationwide ? 6 : 10, { animate: true });
    } else {
      map.fitBounds(L.latLngBounds(bounds), {
        paddingTopLeft: [45, 95],
        paddingBottomRight: [document.getElementById("sidebar").classList.contains("open") ? CONFIG.sidebarPadding : 45, 45],
        maxZoom: nationwide ? 7 : 10,
        animate: true
      });
    }
  }, 300);
}

function createStateMarkers() {
  stateLayer.clearLayers();
  const grouped = new Map();

  stores.forEach(store => {
    const code = stateCode(store.State);
    if (!code) return;
    if (!grouped.has(code)) grouped.set(code, []);
    grouped.get(code).push(store);
  });

  grouped.forEach((items, code) => {
    const valid = items.filter(store => validCoords(latitudeOf(store), longitudeOf(store)));
    let center = STATE_CENTERS[code];
    if (valid.length) {
      center = [
        valid.reduce((sum, store) => sum + latitudeOf(store), 0) / valid.length,
        valid.reduce((sum, store) => sum + longitudeOf(store), 0) / valid.length
      ];
    }
    if (!center) return;

    const counts = countStatuses(items);
    const marker = L.marker(center, {
      icon: stateIcon(code, items),
      zIndexOffset: counts.RED ? 30000 : counts.YELLOW ? 20000 : 1000
    });

    marker.bindTooltip(
      `<strong>${escapeHtml(STATE_NAMES[code] || code)}</strong><br>${items.length} stores<br>${counts.RED + counts.YELLOW} impacted<br><small>Click to view stores</small>`,
      { direction: "top", offset: [0, -20], className: "state-tooltip" }
    );

    marker.on("click", event => {
      if (event?.originalEvent) L.DomEvent.stopPropagation(event.originalEvent);
      selectState(code);
    });

    marker.addTo(stateLayer);
  });
}

function selectState(code) {
  const normalizedCode = stateCode(code);
  if (!normalizedCode) return;

  selectedState = normalizedCode;
  map.closePopup();
  if (map.hasLayer(stateLayer)) map.removeLayer(stateLayer);
  if (!map.hasLayer(storeLayer)) storeLayer.addTo(map);

  document.getElementById("filterSelect").value = "all";
  document.getElementById("searchBar").value = "";

  const stateStores = stores.filter(store => stateCode(store.State) === normalizedCode);
  document.getElementById("viewLabel").textContent = `${STATE_NAMES[normalizedCode] || normalizedCode} store view`;

  setSidebar(false);
  renderStoreList();
  renderStoreMarkers(stateStores, true, false);
}

function resetUSA() {
  selectedState = "";
  map.closePopup();
  storeLayer.clearLayers();
  markerBySite.clear();
  document.getElementById("searchBar").value = "";
  document.getElementById("filterSelect").value = "all";
  document.getElementById("viewLabel").textContent = "USA overview";
  setSidebar(true);
  createStateMarkers();
  if (!map.hasLayer(stateLayer)) stateLayer.addTo(map);
  renderStoreList();
  map.fitBounds(CONFIG.usaDisplayBounds, { padding: [2, 2], animate: false });
}

function showNationwideOutages() {
  selectedState = "";
  map.closePopup();
  if (map.hasLayer(stateLayer)) map.removeLayer(stateLayer);
  document.getElementById("viewLabel").textContent = "Nationwide outages";
  setSidebar(false);
  const items = sortedStores(filteredStores());
  renderStoreList();
  renderStoreMarkers(items, true, true);
}

function refreshCurrentView() {
  updateMetrics();
  createStateMarkers();

  const filter = document.getElementById("filterSelect").value;
  if (filter === "outages") {
    showNationwideOutages();
  } else if (selectedState) {
    selectState(selectedState);
  } else {
    resetUSA();
  }
}

function changeMapStyle(style) {
  if (!tileLayers[style]) style = "light";
  if (activeTileLayer) map.removeLayer(activeTileLayer);
  activeTileLayer = tileLayers[style].addTo(map);
  document.getElementById("mapStyleSelect").value = style;
  localStorage.setItem(CONFIG.mapStyleStorageKey, style);
}

function buildProviderLookup(outages) {
  providerStatusBySite.clear();
  outages.forEach(item => {
    const key = keyOf(item);
    if (!key) return;
    const status = normalizeStatus(firstValue(item, ["status", "Status", "color", "Color", "outageStatus", "effectiveStatus"]));
    const existing = providerStatusBySite.get(key);
    if (!existing || STATUS[status].rank < STATUS[existing].rank) providerStatusBySite.set(key, status);
  });
}

async function loadJson(url) {
  try {
    const response = await fetch(`${url}?v=${Date.now()}`, { cache: "no-store" });
    if (!response.ok) throw new Error(`${response.status} ${response.statusText}`);
    const value = await response.json();
    return Array.isArray(value) ? value : Array.isArray(value.outages) ? value.outages : Array.isArray(value.sites) ? value.sites : [];
  } catch (error) {
    console.warn(`Could not load ${url}.`, error);
    return [];
  }
}

async function loadSites() {
  const response = await fetch(`${CONFIG.sitesUrl}?v=${Date.now()}`, { cache: "no-store" });
  if (!response.ok) throw new Error(`Sites CSV failed: ${response.status} ${response.statusText}`);
  const csvText = await response.text();
  const result = Papa.parse(csvText, { header: true, skipEmptyLines: true, dynamicTyping: false });
  if (result.errors.length) console.warn("CSV parse warnings:", result.errors);
  return result.data.filter(store => keyOf(store));
}

function attachEvents() {
  document.getElementById("usaButton").addEventListener("click", resetUSA);
  document.getElementById("storesButton").addEventListener("click", () => {
    document.getElementById("sidebar").classList.toggle("open");
    window.setTimeout(() => map.invalidateSize({ animate: false }), 230);
  });
  document.getElementById("closeSidebar").addEventListener("click", () => setSidebar(true));
  document.getElementById("searchBar").addEventListener("input", renderStoreList);
  document.getElementById("mapStyleSelect").addEventListener("change", event => changeMapStyle(event.target.value));
  document.getElementById("filterSelect").addEventListener("change", event => {
    if (event.target.value === "outages") showNationwideOutages();
    else if (selectedState) selectState(selectedState);
    else resetUSA();
  });
}

async function initialize() {
  changeMapStyle(localStorage.getItem(CONFIG.mapStyleStorageKey) || "light");
  map.fitBounds(CONFIG.usaDisplayBounds, { padding: [2, 2], animate: false });
  attachEvents();

  try {
    const [siteData, outageData] = await Promise.all([loadSites(), loadJson(CONFIG.outagesUrl)]);
    stores = siteData;
    providerOutages = outageData;
    buildProviderLookup(providerOutages);
    updateMetrics();
    createStateMarkers();
    renderStoreList();
    console.log(`Loaded ${stores.length} stores and ${providerOutages.length} outage records.`);
  } catch (error) {
    console.error(error);
    document.getElementById("storeList").innerHTML = `<div class="empty-state">The store file could not be loaded. Confirm data/Sites.csv exists and open this page through GitHub Pages or a web server.</div>`;
  }
}

initialize();
</script>
</body>

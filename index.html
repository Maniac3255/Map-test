<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Power Outage Demo</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>

html,
body {
    margin: 0;
    padding: 0;
}

#map {
    height: 100vh;
    width: 100%;
}

</style>

</head>

<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

// Create Map

const map = L.map('map').setView(
    [34.0, -118.0],
    6
);

// Base Map

L.tileLayer(
    'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
        maxZoom: 19
    }
).addTo(map);

// Load outage data

fetch('outages.json')
.then(response => response.json())
.then(data => {

    const bounds = [];

    data.forEach(site => {

        // Add outage coordinates to zoom bounds

        bounds.push([
            site.outage_lat,
            site.outage_lon
        ]);

        bounds.push([
            site.lat,
            site.lon
        ]);

        // ==========================
        // RED OUTAGE MARKER
        // ==========================

        L.marker([
            site.outage_lat,
            site.outage_lon
        ])
        .addTo(map)
        .bindPopup(`
            <b>SCE Outage</b><br>
            Incident: ${site.incident}<br>
            Customers Affected:
            ${site.affected_customers}
        `);

        // ==========================
        // YELLOW IMPACT AREA
        // ==========================

        L.circle(
            [
                site.outage_lat,
                site.outage_lon
            ],
            {
                color: 'yellow',
                fillColor: 'yellow',
                fillOpacity: 0.25,
                radius: 1609
            }
        )
        .addTo(map);

        // ==========================
        // GREEN STORE MARKER
        // ==========================

        L.circleMarker(
            [
                site.lat,
                site.lon
            ],
            {
                color: 'green',
                fillColor: 'green',
                fillOpacity: 1,
                radius: 8
            }
        )
        .addTo(map)
        .bindPopup(`
            <b>${site.name}</b><br>
            Site #: ${site.site}<br>
            Vendor: ${site.vendor}<br>
            City: ${site.city}, ${site.state}<br>
            Distance From Outage:
            ${site.distance} miles
        `);

    });

    // Auto zoom to all markers

    if (bounds.length > 0) {
        map.fitBounds(bounds);
    }

})
.catch(error => {

    console.error(
        "Failed loading outages.json",
        error
    );

});

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Store Outage NOC — Pushpin Markers, NOAA + RainViewer</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <style>
    html,body { height:100%; margin:0; padding:0; font-family:Arial, sans-serif; background:#0f0f0f; color:#fff; }
    /* Layout */
    #map { position:absolute; top:0; left:0; right:360px; bottom:0; transition:right 0.28s ease; z-index:1; }
    #sidebar { position:absolute; top:0; right:0; width:360px; bottom:0; background:#151515; border-left:1px solid #2b2b2b; padding:0; overflow:hidden; z-index:10000; display:flex; flex-direction:column; }
    /* Top area (search + controls) stays fixed while store list scrolls) */
    .sidebar-top { position:sticky; top:0; z-index:10; padding:12px; background:linear-gradient(180deg,#151515,#121212); border-bottom:1px solid #222; }
    #sidebarHeader { display:flex; align-items:center; justify-content:space-between; gap:8px; }
    .header-btn { background:#222; color:#fff; border:1px solid #333; padding:6px 8px; border-radius:6px; cursor:pointer; }
    #filterSelect, #searchBar { width:100%; padding:8px; margin:10px 0 0 0; border-radius:6px; border:1px solid #333; background:#1b1b1b; color:#fff; box-sizing:border-box; }
    /* Scrollable store list below the sticky top */
    #storeList { padding:12px; overflow:auto; flex:1 1 auto; box-sizing:border-box; }
    .store-item { background:#1b1b1b; border:1px solid #2b2b2b; padding:8px; margin:6px 0; border-radius:6px; cursor:pointer; color:#fff; }
    .store-item:hover { background:#262626; }
    #collapseBubble { position:absolute; top:12px; right:12px; width:40px; height:40px; border-radius:50%; background:#151515; border:1px solid #333; display:none; align-items:center; justify-content:center; cursor:pointer; z-index:10001; color:#fff; font-size:18px; }
    body.sidebar-collapsed #collapseBubble { display:flex; }
    #bottomDashboard { position:fixed; left:0; right:0; bottom:0; height:320px; transform:translateY(100%); transition: transform 0.28s ease; background:#fff; color:#000; z-index:9999; border-top:1px solid #ccc; }
    #bottomDashboard.expanded { transform:translateY(0); }
    #dashboardHandle { position:absolute; top:-36px; left:50%; transform:translateX(-50%); width:160px; height:36px; border-radius:18px 18px 0 0; background:#151515; color:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer; border:1px solid #333; z-index:10002; }
    #dashboardContent { padding:12px; height:100%; overflow:auto; }
    .dash-cards { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
    .dash-card { background:#fff; color:#000; padding:10px; border-radius:6px; flex:1 1 48%; min-width:120px; border:1px solid #ddd; }
    .dash-list-item { padding:6px 0; border-bottom:1px dashed #ddd; cursor:pointer; }

    /* Radar control */
    .radar-vertical { display:flex; flex-direction:column; align-items:center; gap:8px; padding:6px; background:rgba(20,20,20,0.95); border-radius:6px; box-shadow:0 1px 6px rgba(0,0,0,0.4); color:#fff; }
    .radar-vertical input[type="range"] { -webkit-appearance: slider-vertical; width: 8px; height: 120px; transform: none; background: transparent; }
    .radar-vertical button { background:#1a73e8; color:#fff; border:none; padding:6px 8px; border-radius:4px; cursor:pointer; font-size:13px; }
    .leaflet-top.leaflet-left .radar-vertical-container { margin-top: 88px; margin-left: 8px; }

    /* Marker animations and enlargement */
    .leaflet-marker-icon.pulse { animation: pulse 1s infinite; transform-origin:center bottom; }
    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.08); } 100% { transform: scale(1); } }

    .leaflet-marker-icon {
      transform-origin: center bottom;
      transition: transform 220ms cubic-bezier(.2,.9,.2,1), filter 220ms ease;
      will-change: transform;
    }

    /* Enlarged state for outage markers (we also set icon size in JS) */
    .leaflet-marker-icon.enlarge {
      transform: scale(1.35);
      z-index: 9999 !important;
      filter: drop-shadow(0 6px 12px rgba(0,0,0,0.35));
    }
    .leaflet-marker-icon.enlarge.pulse { animation: pulse 1s infinite; }

    /* Zoom display and legend */
    #zoomDisplay { position:absolute; left:8px; bottom:8px; z-index:6500; background:rgba(0,0,0,0.6); color:#fff; padding:6px; border-radius:6px; font-size:13px; }
    .legend { font-size:13px; }

    /* Toasts for NOC alerts */
    .noc-toast { position:fixed; right:16px; top:16px; z-index:12000; background:#222; color:#fff; padding:10px 14px; border-radius:6px; box-shadow:0 6px 18px rgba(0,0,0,0.5); opacity:0; transform:translateY(-8px); transition:opacity .18s ease, transform .18s ease; }
    .noc-toast.visible { opacity:1; transform:translateY(0); }
    .noc-toast.critical { background:#8b0000; }
    .noc-toast.warn { background:#8a6d00; }

    /* Overlay that dims map when sidebar is open (click to collapse) */
    #sidebarOverlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 360px;
      bottom: 0;
      background: rgba(0,0,0,0.35);
      z-index: 9998;
      display: none;
      transition: opacity 180ms ease;
    }
    body.sidebar-open #sidebarOverlay { display:block; opacity:1; }

    /* When sidebar collapsed, expand map to full width */
    body.sidebar-collapsed #map { right: 0 !important; }
    body.sidebar-collapsed #sidebar { transform: translateX(100%); }
    body.sidebar-collapsed #sidebarOverlay { display:none !important; }

    /* Small screens: make sidebar overlay */
    @media (max-width:900px) {
      #map { right:0; }
      #sidebar { width:100%; right:0; }
      #sidebarOverlay { right:0; }
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <div id="sidebar" role="complementary" aria-label="Store list">
    <div class="sidebar-top">
      <div id="sidebarHeader">
        <h3 style="margin:0;">All Stores</h3>
        <div style="display:flex; gap:6px; align-items:center;">
          <button id="resetStateBtn" class="header-btn">All USA</button>
          <button id="toggleBtn" class="header-btn" aria-expanded="true">▸</button>
        </div>
      </div>

      <select id="filterSelect">
        <option value="all">All Stores</option>
        <option value="outages">Outages Only</option>
      </select>

      <input id="searchBar" placeholder="Search store #, name, city..." />
    </div>

    <div id="storeList" aria-live="polite"></div>
  </div>

  <div id="sidebarOverlay" title="Click to collapse sidebar"></div>

  <div id="collapseBubble" title="Show sidebar">◂</div>

  <div id="bottomDashboard">
    <div id="dashboardHandle">▲ Dashboard</div>
    <div id="dashboardContent"></div>
  </div>

  <div id="zoomDisplay">Zoom 4</div>
  <div id="toastContainer" aria-live="polite" aria-atomic="true"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <script>
  /* Changes implemented:
     - Default view shows only USA (coast-to-coast) by default.
     - Right panel can be collapsed; an overlay dims the map when the panel is open.
     - Red outage markers are static (no pulse); they are enlarged (5x) and brought to front.
     - Robust coordinate parsing ensures markers use correct coordinates.
     - Sidebar top (search + controls) remains sticky while store list scrolls.
  */

  const SNAPSHOT_KEY = 'outageSnapshots_v1';

  function pushpinDataUrl(color = '#6b6b6b') {
    const svg = `
      <svg xmlns="http://www.w3.org/2000/svg" width="40" height="56" viewBox="0 0 40 56">
        <g>
          <path d="M20 0C12.3 0 6 6.3 6 14c0 9.8 11.6 22.6 12.6 23.8.6.7 1.6.7 2.2 0C22.4 36.6 34 23.8 34 14 34 6.3 27.7 0 20 0z" fill="${color}" />
          <circle cx="20" cy="14" r="6.5" fill="#fff" opacity="0.12"/>
          <circle cx="20" cy="14" r="4.2" fill="#fff" opacity="0.18"/>
        </g>
      </svg>`;
    return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
  }

  function safeGetItem(k){ try { return localStorage.getItem(k); } catch { return null; } }
  function safeSetItem(k,v){ try { localStorage.setItem(k,v); } catch {} }

  function parseCSV(text){
    if(!text) return [];
    const lines = text.trim().split("\n").filter(Boolean);
    if(!lines.length) return [];
    const headers = lines[0].split(",").map(h=>h.trim());
    return lines.slice(1).map(line=>{
      const cols = line.split(",");
      const obj = {};
      headers.forEach((h,i)=> obj[h] = (cols[i]||"").trim());
      return obj;
    });
  }

  // Robust coordinate parser and validator
  function parseCoordsFlexible(rawLat, rawLon) {
    const clean = v => {
      if (v === null || v === undefined) return "";
      if (typeof v === "number") return String(v);
      return String(v).replace(/[^\d\.\-\+eE,]/g, "").trim();
    };
    let latS = clean(rawLat);
    let lonS = clean(rawLon);

    if ((!latS || !lonS) && typeof rawLat === "string" && rawLat.includes(",")) {
      const parts = rawLat.split(",").map(p => p.trim());
      if (parts.length >= 2) { latS = parts[0]; lonS = parts[1]; }
    }

    let lat = parseFloat(latS);
    let lon = parseFloat(lonS);

    if (!isFinite(lat) || !isFinite(lon)) return null;

    if (lat < -90 || lat > 90 || lon < -180 || lon > 180) {
      if (lon >= -90 && lon <= 90 && lat >= -180 && lat <= 180) {
        const tmp = lat; lat = lon; lon = tmp;
      } else {
        return null;
      }
    }
    if (lat < -90 || lat > 90 || lon < -180 || lon > 180) return null;
    return { lat, lon };
  }

  let stores = [];
  let map = null;
  let markers = {};
  let storeLayer = null;
  let nowcoastWms = null;
  let trendChart = null;

  function showToast(text, severity = 'info', timeout = 8000) {
    const container = document.getElementById('toastContainer');
    const t = document.createElement('div');
    t.className = 'noc-toast ' + (severity === 'critical' ? 'critical' : (severity === 'warn' ? 'warn' : ''));
    t.textContent = text;
    container.appendChild(t);
    requestAnimationFrame(() => t.classList.add('visible'));
    setTimeout(() => {
      t.classList.remove('visible');
      setTimeout(()=> t.remove(), 300);
    }, timeout);
  }

  function renderStoreList(filterText = ""){
    const storeListDiv = document.getElementById("storeList");
    if(!storeListDiv) return;
    storeListDiv.innerHTML = "";
    const q = (filterText || "").toLowerCase();
    const filterSelect = document.getElementById("filterSelect");
    const filtered = stores.filter(s => {
      if(filterSelect && filterSelect.value === "outages" && (s.color || "white") === "white") return false;
      const site = String(s["Site #"] || s.Site || "").toLowerCase();
      const name = String(s.SiteName || "").toLowerCase();
      const city = String(s.City || "").toLowerCase();
      return !q || site.includes(q) || name.includes(q) || city.includes(q);
    });

    filtered.forEach(store => {
      const div = document.createElement("div");
      div.className = "store-item";
      div.innerHTML = `
        <b>${store["Site #"] || ""} – ${store.SiteName || ""}</b><br>
        ${store.Location || "N/A"}<br>
        ${store.City || ""}, ${store.State || ""}<br>
        <span style="color:${store.color || 'white'}">● ${(store.color || 'white').toUpperCase()}</span>
        ${store.providerWebsite ? `<br><a href="${store.providerWebsite}" target="_blank" style="color:#1a73e8;">Outage Map</a>` : ""}
      `;
      div.onclick = () => {
        const entry = markers[String(store["Site #"])];
        if(entry && entry.marker) focusStoreOnMap(entry.marker);
      };
      storeListDiv.appendChild(div);
    });
  }

  function renderDashboard(storesForDash){
    const container = document.getElementById("dashboardContent");
    if(!container) return;
    container.innerHTML = "";
    const list = storesForDash || stores;
    const outageStores = list.filter(s => (s.color || "white") !== "white");
    const byState = {}, byProvider = {};
    outageStores.forEach(s => { byState[s.State] = (byState[s.State]||0)+1; byProvider[s["Vendor Name"]] = (byProvider[s["Vendor Name"]]||0)+1; });

    container.innerHTML += `
      <div class="dash-cards">
        <div class="dash-card"><h3>Total Stores</h3><p>${list.length}</p></div>
        <div class="dash-card"><h3>Current Outages</h3><p>${outageStores.length}</p></div>
        <div class="dash-card"><h3>Unique Providers</h3><p>${Object.keys(byProvider).length}</p></div>
        <div class="dash-card"><h3>Last Snapshot</h3><p>${new Date().toLocaleString()}</p></div>
      </div>
      <h3>Outages by State</h3><div id="byState" class="dash-list"></div>
      <h3>Outages by Provider</h3><div id="byProvider" class="dash-list"></div>
      <h3>24–48h Outage Trend</h3><canvas id="trendChart" width="320" height="160"></canvas>
    `;

    const stateDiv = document.getElementById("byState");
    Object.entries(byState).forEach(([st,cnt])=>{
      const el = document.createElement("div");
      el.className = "dash-list-item";
      el.textContent = `${st}: ${cnt}`;
      stateDiv.appendChild(el);
    });

    const provDiv = document.getElementById("byProvider");
    Object.entries(byProvider).forEach(([p,cnt])=> provDiv.innerHTML += `<div class="dash-list-item">${p}: ${cnt}</div>`);

    try {
      const snaps = JSON.parse(safeGetItem(SNAPSHOT_KEY) || "[]");
      const labels = snaps.map(s => new Date(s.ts).toLocaleString());
      const data = snaps.map(s => s.count);
      const ctx = document.getElementById("trendChart").getContext("2d");
      if(trendChart) trendChart.destroy();
      trendChart = new Chart(ctx, { type:"line", data:{ labels, datasets:[{ label:"Active outages", data, backgroundColor:"rgba(255,99,132,0.2)", borderColor:"rgba(255,99,132,1)", tension:0.3 }] } });
    } catch(e){}
  }

  function focusStoreOnMap(marker) {
    const targetZoom = 15;
    if (map.flyTo) {
      map.flyTo(marker.getLatLng(), targetZoom, { duration: 0.7 });
    } else {
      map.setView(marker.getLatLng(), targetZoom);
    }
    marker.openPopup();
  }

  function initMapAndLayers(){
    // Default view: whole USA coast-to-coast
    const MIN_Z = 2;   // show coast-to-coast comfortably
    const MAX_Z = 19;
    const USA_CENTER = [39.0, -98.0];
    const USA_ZOOM = 3; // default zoom focused on whole USA

    map = L.map("map", {
      center: USA_CENTER,
      zoom: USA_ZOOM,
      minZoom: MIN_Z,
      maxZoom: MAX_Z,
      zoomSnap: 1,
      zoomDelta: 1,
      preferCanvas: true
    });
    window.map = map;

    // create panes
    map.createPane('tilePane');
    map.createPane('storePane'); map.getPane('storePane').style.zIndex = 450;
    map.createPane('markerPane'); map.getPane('markerPane').style.zIndex = 500;
    map.createPane('radarPane'); map.getPane('radarPane').style.zIndex = 610; map.getPane('radarPane').style.pointerEvents = 'none';

    // base map (OSM)
    const osm = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: '&copy; OpenStreetMap contributors',
      maxZoom: MAX_Z
    }).addTo(map);

    storeLayer = L.layerGroup([], { pane: 'storePane' }).addTo(map);

    // simple legend
    const legend = L.control({ position: "bottomleft" });
    legend.onAdd = function(){
      const d = L.DomUtil.create("div","legend");
      d.style.background = "#151515"; d.style.color = "#fff"; d.style.padding = "8px"; d.style.borderRadius = "6px";
      d.innerHTML = `<div style="display:flex;align-items:center;"><span style="background:red;width:14px;height:14px;display:inline-block;margin-right:8px;border-radius:3px;"></span>Outage</div>
                     <div style="display:flex;align-items:center;"><span style="background:yellow;width:14px;height:14px;display:inline-block;margin-right:8px;border-radius:3px;"></span>Possible</div>
                     <div style="display:flex;align-items:center;"><span style="background:#6b6b6b;width:14px;height:14px;display:inline-block;margin-right:8px;border-radius:3px;"></span>No Outage</div>`;
      return d;
    };
    legend.addTo(map);

    // NowCOAST WMS (proxy-ready)
    const NOWCOAST_WMS_BASE = 'https://nowcoast.noaa.gov/wms/com.esri.wms.Esrimap/obs';
    const PROXY_WMS_BASE = '/proxy/wms';
    let useProxy = false;
    const wmsUrl = useProxy ? PROXY_WMS_BASE : NOWCOAST_WMS_BASE;

    nowcoastWms = L.tileLayer.wms(wmsUrl, {
      layers: 'RAS_Radar_Nexrad_Reflectivity',
      format: 'image/png',
      transparent: true,
      version: '1.3.0',
      attribution: 'NOAA NowCOAST',
      pane: 'radarPane',
      minZoom: MIN_Z,
      maxZoom: 12
    });

    // RainViewer fallback
    window.rainViewerLayer = L.tileLayer('https://tilecache.rainviewer.com/v2/radar/256/{z}/{x}/{y}/0/0_0.png', {
      pane: 'radarPane',
      opacity: 0.6,
      attribution: 'RainViewer',
      minZoom: MIN_Z,
      maxZoom: 16,
      maxNativeZoom: 16
    });

    setTimeout(()=> map.invalidateSize(), 300);

    // Create markers after map is ready
    createMarkersFromStores();
  }

  function createMarkersFromStores(){
    try {
      if (!Array.isArray(stores)) { console.warn("No stores array found."); return; }
      if (!storeLayer) { console.warn("storeLayer missing."); return; }

      markers = {};
      storeLayer.clearLayers();

      let created = 0;
      const BASE_ICON = { width: 28, height: 44 };

      function makeIcon(color, zoom, enlarge=false, redHuge=false) {
        const MIN_Z = map.getMinZoom();
        const MAX_Z = Math.min(map.getMaxZoom(), 19);
        const z = Math.max(MIN_Z, Math.min(MAX_Z, zoom));
        const t = (z - MIN_Z) / Math.max(0.0001, (MAX_Z - MIN_Z));
        const scale = 0.45 + 0.55 * t;
        let w = Math.max(10, Math.round(BASE_ICON.width * scale));
        let h = Math.max(14, Math.round(BASE_ICON.height * scale));
        if (enlarge) { w = Math.round(w * 1.15); h = Math.round(h * 1.15); }
        if (redHuge) { w = Math.round(w * 5); h = Math.round(h * 5); } // 5x for red outage
        const colorHex = (color === 'red') ? '#ff4d4d' : (color === 'yellow') ? '#ffd54f' : '#6b6b6b';
        const url = pushpinDataUrl(colorHex);
        return L.icon({
          iconUrl: url,
          iconSize: [w, h],
          iconAnchor: [Math.round(w/2), h],
          popupAnchor: [1, -Math.round(h*0.8)]
        });
      }

      stores.forEach((store, idx) => {
        const latRaw = store.Latitude ?? store.lat ?? store.Lat ?? store.outageLat ?? store.latitude ?? store.Y ?? "";
        const lonRaw = store.Longitude ?? store.lon ?? store.Long ?? store.outageLon ?? store.longitude ?? store.X ?? "";
        const coords = parseCoordsFlexible(latRaw, lonRaw);
        if (!coords) {
          console.warn(`Skipping store index ${idx} (invalid coords)`, store["Site #"] || store.SiteName || store);
          return;
        }
        const lat = coords.lat, lon = coords.lon;
        store._lat = lat;
        store._lon = lon;

        const color = (store.color === 'red') ? 'red' : (store.color === 'yellow' ? 'yellow' : 'gray');
        const isOutage = (color === 'red' || color === 'yellow');
        const redHuge = (color === 'red');
        const icon = makeIcon(color, map.getZoom(), isOutage && !redHuge, redHuge);

        const marker = L.marker([lat, lon], { icon, pane: (storeLayer.options && storeLayer.options.pane) ? storeLayer.options.pane : undefined });

        const popupHtml = `
          <b>Store ${store["Site #"] || ""} – ${store.SiteName || ""}</b><br>
          ${store.Location || "N/A"}<br>
          ${store.City || ""}, ${store.State || ""}<br>
          <b>Status:</b> ${store.status || "No outage"}<br>
          <b>ETA:</b> ${store.etr || "N/A"}<br>
          <b>Last Updated:</b> ${store.lastUpdated || "N/A"}<br>
          ${store.providerWebsite ? `<br><a href="${store.providerWebsite}" target="_blank">Outage Map</a>` : ""}
        `;
        marker.bindPopup(popupHtml);

        // marker click zooms to street-level (15)
        marker.on('click', () => focusStoreOnMap(marker));

        marker.addTo(storeLayer);

        const key = String(store["Site #"] || `${store.SiteName || "store"}_${created}`);
        markers[key] = { marker, store };

        // If initial state is outage, bring to front and apply classes
        if (isOutage) {
          try {
            marker.setZIndexOffset(1000);
            if (marker.bringToFront) marker.bringToFront();
            setTimeout(() => {
              const el = marker._icon;
              if (el) {
                // Red: enlarged but static (no pulse)
                if (color === 'red') {
                  el.classList.add('enlarge');
                  el.classList.remove('pulse');
                } else {
                  // Yellow: enlarged + pulse
                  el.classList.add('enlarge');
                  el.classList.add('pulse');
                }
              }
            }, 80);
          } catch(e){}
        }

        created++;
      });

      function updateMarkerIconsOnZoom() {
        const z = map.getZoom();
        Object.values(markers).forEach(entry => {
          const store = entry.store;
          const color = (store.color === 'red') ? 'red' : (store.color === 'yellow' ? 'yellow' : 'gray');
          const isOutage = (color === 'red' || color === 'yellow');
          const redHuge = (color === 'red');
          const newIcon = makeIcon(color, z, isOutage && !redHuge, redHuge);
          try { entry.marker.setIcon(newIcon); } catch(e) {}
          setTimeout(() => {
            const el = entry.marker._icon;
            if (!el) return;
            if (isOutage) {
              if (color === 'red') {
                el.classList.add('enlarge');
                el.classList.remove('pulse');
              } else {
                el.classList.add('enlarge');
                el.classList.add('pulse');
              }
            } else {
              el.classList.remove('enlarge');
              el.classList.remove('pulse');
            }
          }, 60);
        });
      }

      map.off('zoomend', updateMarkerIconsOnZoom);
      map.on('zoomend', updateMarkerIconsOnZoom);
      map.on('zoom', () => {
        const zd = document.getElementById('zoomDisplay');
        if (zd) zd.textContent = 'Zoom ' + map.getZoom().toFixed(0);
      });

      updateMarkerIconsOnZoom();

    } catch (err) {
      console.error("createMarkersFromStores error:", err);
    }
  }

  function updateOutageStatusForStore(storeNumber, newStatusObj) {
    const key = String(storeNumber);
    const entry = markers[key];
    if (!entry) return;
    const marker = entry.marker;
    const store = entry.store;

    store.color = newStatusObj.color || store.color || 'white';
    store.status = newStatusObj.status || store.status;
    store.etr = newStatusObj.etr || store.etr;
    store.lastUpdated = newStatusObj.lastUpdated || store.lastUpdated;

    const MIN_Z = map.getMinZoom ? map.getMinZoom() : 3;
    const MAX_Z = map.getMaxZoom ? map.getMaxZoom() : 19;
    const z = map.getZoom();
    const t = (z - MIN_Z) / Math.max(1, (MAX_Z - MIN_Z));
    const scale = 0.45 + 0.55 * t;
    const baseW = 28, baseH = 44;
    let w = Math.max(10, Math.round(baseW * scale));
    let h = Math.max(14, Math.round(baseH * scale));

    if (store.color === 'red') {
      w = Math.round(w * 5);
      h = Math.round(h * 5);
    } else if (store.color === 'yellow') {
      w = Math.round(w * 1.5);
      h = Math.round(h * 1.5);
    }

    const colorHex = (store.color === "red") ? '#ff4d4d' : (store.color === "yellow") ? '#ffd54f' : '#6b6b6b';
    const iconUrl = pushpinDataUrl(colorHex);

    const newIcon = L.icon({
      iconUrl,
      iconSize: [w, h],
      iconAnchor: [Math.round(w/2), h],
      popupAnchor: [1, -Math.round(h*0.8)]
    });

    try { marker.setIcon(newIcon); } catch (e) { console.warn('setIcon failed', e); }

    const applyDomClasses = () => {
      const el = marker._icon;
      if (!el) return;
      if (store.color === 'red') {
        marker.setZIndexOffset(5000);
        if (marker.bringToFront) marker.bringToFront();
        el.classList.add('enlarge');
        el.classList.remove('pulse'); // red static
        showToast(`CRITICAL: Store ${store["Site #"]} outage`, 'critical', 10000);
      } else if (store.color === 'yellow') {
        marker.setZIndexOffset(4000);
        if (marker.bringToFront) marker.bringToFront();
        el.classList.add('enlarge');
        el.classList.add('pulse'); // yellow pulses
        showToast(`Warning: Store ${store["Site #"]} possible outage`, 'warn', 7000);
      } else {
        marker.setZIndexOffset(0);
        el.classList.remove('pulse');
        el.classList.remove('enlarge');
      }
    };

    applyDomClasses();
    setTimeout(applyDomClasses, 120);

    const popupHtml = `
      <b>Store ${store["Site #"] || ""} – ${store.SiteName || ""}</b><br>
      ${store.Location || "N/A"}<br>
      ${store.City || ""}, ${store.State || ""}<br>
      <b>Status:</b> ${store.status || "No outage"}<br>
      <b>ETA:</b> ${store.etr || "N/A"}<br>
      <b>Last Updated:</b> ${store.lastUpdated || "N/A"}<br>
      ${store.providerWebsite ? `<br><a href="${store.providerWebsite}" target="_blank">Outage Map</a>` : ""}
    `;
    if (marker.getPopup()) marker.setPopupContent(popupHtml);
  }

  /* Sidebar collapse + overlay wiring */
  (function wireSidebarCollapse(){
    const toggle = document.getElementById("toggleBtn");
    const bubble = document.getElementById("collapseBubble");
    const sidebarEl = document.getElementById("sidebar");
    const mapEl = document.getElementById("map");
    const overlay = document.getElementById("sidebarOverlay");

    function setCollapsed(collapsed){
      if(collapsed){
        document.body.classList.add("sidebar-collapsed");
        document.body.classList.remove("sidebar-open");
        sidebarEl.setAttribute("aria-hidden","true");
        if(bubble) bubble.style.display = "flex";
        if(toggle){ toggle.setAttribute("aria-expanded","false"); toggle.innerText = "◂"; }
        mapEl.style.right = "0";
      } else {
        document.body.classList.remove("sidebar-collapsed");
        document.body.classList.add("sidebar-open");
        sidebarEl.setAttribute("aria-hidden","false");
        if(bubble) bubble.style.display = "none";
        if(toggle){ toggle.setAttribute("aria-expanded","true"); toggle.innerText = "▸"; }
        mapEl.style.right = sidebarEl.offsetWidth + "px";
      }
      setTimeout(() => { if(window.map && typeof window.map.invalidateSize === "function") window.map.invalidateSize(); }, 260);
    }

    // start with sidebar open
    setCollapsed(false);

    if(toggle){
      toggle.addEventListener("click", (ev) => {
        ev.stopPropagation();
        const collapsed = !document.body.classList.contains("sidebar-collapsed");
        setCollapsed(collapsed);
      });
    }

    if(bubble){
      bubble.addEventListener("click", (ev) => {
        ev.stopPropagation();
        setCollapsed(false);
      });
    }

    if(overlay){
      overlay.addEventListener("click", () => setCollapsed(true));
    }

    window.addEventListener('resize', () => {
      if (!document.body.classList.contains("sidebar-collapsed")) {
        mapEl.style.right = sidebarEl.offsetWidth + "px";
        if(window.map && typeof window.map.invalidateSize === "function") window.map.invalidateSize();
      }
    });
  })();

  /* UI wiring */
  (function wireUI(){
    const filter = document.getElementById("filterSelect");
    const search = document.getElementById("searchBar");
    const dashHandle = document.getElementById("dashboardHandle");
    const bottom = document.getElementById("bottomDashboard");
    const resetStateBtn = document.getElementById("resetStateBtn");

    if(search){
      search.addEventListener("input", e => {
        const q = (e.target.value || "").trim().toLowerCase();
        if(!q) { renderStoreList(); return; }
        const found = stores.find(s => String(s["Site #"]).toLowerCase() === q);
        if(found && markers[String(found["Site #"])]) {
          const m = markers[String(found["Site #"])].marker;
          focusStoreOnMap(m);
        } else renderStoreList(q);
      });
    }

    if(filter) filter.addEventListener("change", ()=> renderStoreList((search && search.value) ? search.value.toLowerCase() : ""));

    if(dashHandle && bottom) dashHandle.addEventListener("click", ()=> {
      bottom.classList.toggle("expanded");
      if(bottom.classList.contains("expanded")) renderDashboard(stores);
    });

    if (resetStateBtn) {
      resetStateBtn.onclick = (ev) => {
        ev.preventDefault();
        ev.stopPropagation();
        try {
          if (window.map) window.map.setView([39.0, -98.0], 3);
          renderStoreList();
          renderDashboard(stores);
          setTimeout(() => { if (window.map && typeof window.map.invalidateSize === "function") window.map.invalidateSize(); }, 120);
        } catch (e) {
          console.error("resetStateBtn click handler error:", e);
        }
      };
    }
  })();

  /* Load data and start */
  Promise.all([
    fetch("Sites.csv").then(r => r.text()).catch(()=> ""),
    fetch("outages.json").then(r => r.json()).catch(()=> [])
  ]).then(([csvText, outages])=>{
    stores = csvText ? parseCSV(csvText) : [];
    if(!Array.isArray(outages)) outages = [];

    stores.forEach(s => { s["Site #"] = s["Site #"] || s.Site || s.site || s.id || ""; });

    (stores || []).forEach(store => {
      const match = (outages || []).find(o => String(o.storeNumber) === String(store["Site #"]));
      if(match){
        store.color = match.color || "white";
        store.status = match.status || "Unknown";
        store.etr = match.etr || "";
        store.lastUpdated = match.lastUpdated || "";
        store.providerWebsite = match.providerWebsite || store["Vendor Link"] || "";
      } else {
        store.color = "white";
        store.status = "No outage";
        store.providerWebsite = store["Vendor Link"] || "";
      }
    });

    try { safeSetItem(SNAPSHOT_KEY, JSON.stringify([{ ts: Date.now(), count: stores.filter(s=> (s.color||'white')!=="white").length }])); } catch(e){}

    initMapAndLayers();
    renderStoreList();
    renderDashboard(stores);

    // After map and markers exist, update markers to reflect initial outage colors and bring to front if needed
    setTimeout(() => {
      stores.forEach(s => {
        if (s["Site #"]) {
          updateOutageStatusForStore(s["Site #"], { color: s.color, status: s.status, etr: s.etr, lastUpdated: s.lastUpdated });
        }
      });
    }, 600);
  }).catch(err=>{
    console.error("Load failed", err);
    alert("Failed to load Sites.csv or outages.json");
  });

  </script>
